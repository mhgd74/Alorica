                                                    <tr>
                                                        <th className="text-left px-4 py-2 font-semibold">Full Name</th>
                                                        <th className="text-left px-4 py-2 font-semibold">Username</th>
                                                        <th className="text-left px-4 py-2 font-semibold">Role</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {allUsers.map((u) => (
                                                        <tr key={u.username} className="border-t border-gray-100">
                                                            <td className="px-4 py-2 text-gray-800">{u.name}</td>
                                                            <td className="px-4 py-2 text-gray-600">{u.username}</td>
                                                            <td className="px-4 py-2">
                                                                <span className={`text-xs font-semibold px-2 py-1 rounded-full ${u.username === 'admin' ? 'bg-alorica-light text-alorica-blue' : 'bg-gray-100 text-gray-600'}`}>
                                                                    {u.username === 'admin' ? 'Admin' : 'User'}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    <p className="text-xs text-gray-400 mt-4 text-center">
                                        New users are created with a regular (non-admin) role and are saved in this browser.
                                    </p>

                                    <div className="mt-10 bg-gray-50 border border-gray-100 rounded-2xl p-6">
                                        <h3 className="flex items-center gap-2 text-alorica-blue font-bold text-lg mb-2">
                                            <Icon name="database" size={20} className="text-alorica-orange" /> Data Backup &amp; Restore
                                        </h3>
                                        <p className="text-xs text-gray-500 mb-4">
                                            Download a JSON file with all bookings, buses and user accounts — or restore a previous backup.
                                        </p>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <button
                                                type="button"
                                                onClick={handleExportBackup}
                                                className="bg-white border-2 border-alorica-blue text-alorica-blue font-bold py-3 px-4 rounded-xl hover:bg-alorica-light flex items-center justify-center gap-2 transition-all"
                                            >
                                                <Icon name="download" size={18} /> Export backup
                                            </button>
                                            <label className={`bg-white border-2 border-gray-200 text-gray-700 font-bold py-3 px-4 rounded-xl cursor-pointer hover:bg-gray-100 flex items-center justify-center gap-2 transition-all ${importing ? 'opacity-70 cursor-wait' : ''}`}>
                                                <Icon name="upload" size={18} /> {importing ? 'Restoring...' : 'Restore backup'}
                                                <input
                                                    type="file"
                                                    accept="application/json,.json"
                                                    className="hidden"
                                                    onChange={(e) => {
                                                        const file = e.target.files && e.target.files[0];
                                                        e.target.value = '';
                                                        if (!file) return;
                                                        setImporting(true);
                                                        handleImportBackup(file);
                                                    }}
                                                />
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            )}

                            </div>
                        </div>
                        ) : (
                        /* ================= REGULAR USER ================= */
                        <div className="bg-white rounded-3xl shadow-2xl overflow-hidden border border-white">
                            <div className="bg-alorica-blue p-6 sm:p-8 text-white text-center">
                                <h2 className="text-2xl sm:text-3xl font-bold mb-2">Transportation</h2>
                                <p className="opacity-80">Select Arrival or Departure to complete your booking</p>
                            </div>

                            <div className="flex justify-center gap-3 sm:gap-4 pt-6 px-4">
                                <button
                                    type="button"
                                    onClick={() => setActiveTab('arrival')}
                                    className={`flex items-center gap-2 px-8 sm:px-12 py-3 rounded-xl font-bold text-sm sm:text-base transition-all ${
                                        activeTab === 'arrival'
                                            ? 'bg-alorica-orange text-white shadow-lg scale-105'
                                            : 'bg-gray-100 text-alorica-blue hover:bg-alorica-light'
                                    }`}
                                >
                                    <Icon name="plane-landing" size={18} /> Arrival
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setActiveTab('departure')}
                                    className={`flex items-center gap-2 px-8 sm:px-12 py-3 rounded-xl font-bold text-sm sm:text-base transition-all ${
                                        activeTab === 'departure'
                                            ? 'bg-alorica-orange text-white shadow-lg scale-105'
                                            : 'bg-gray-100 text-alorica-blue hover:bg-alorica-light'
                                    }`}
                                >
                                    <Icon name="plane-takeoff" size={18} /> Departure
                                </button>
                            </div>

                            <form key={activeTab} onSubmit={handleBooking} className="p-4 sm:p-8 fade-in">
                                <div className="max-w-2xl mx-auto space-y-6">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label className="flex items-center gap-2 text-alorica-blue font-bold mb-2">
                                                <Icon name="user" size={18} className="text-alorica-orange" /> Employee Name
                                            </label>
                                            <input
                                                required
                                                placeholder="Enter employee full name"
                                                className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50 text-sm sm:text-base"
                                                value={formData.employeeName}
                                                onChange={(e) => setFormData({ ...formData, employeeName: e.target.value })}
                                            />
                                        </div>
                                        <div>
                                            <label className="flex items-center gap-2 text-alorica-blue font-bold mb-2">
                                                <Icon name="hash" size={18} className="text-alorica-orange" /> Employee ID
                                            </label>
                                            <input
                                                required
                                                placeholder="Enter employee ID"
                                                className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50 text-sm sm:text-base"
                                                value={formData.employeeId}
                                                onChange={(e) => setFormData({ ...formData, employeeId: e.target.value })}
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="flex flex-wrap items-center justify-between text-alorica-blue font-bold mb-2 gap-2">
                                            <span className="flex items-center gap-2"><Icon name={dropOffIcon} size={18} className="text-alorica-orange" /> {dropOffLabel}</span>
                                            <button
                                                type="button"
                                                onClick={() => getCurrentLocation('dropOffLocation')}
                                                className="text-[10px] sm:text-xs bg-alorica-light text-alorica-blue px-2 py-1 rounded hover:bg-blue-100 transition-colors flex items-center gap-1 shrink-0"
                                            >
                                                <Icon name="locate" size={12} /> My Location
                                            </button>
                                        </label>
                                        <input
                                            list="fixed-locations"
                                            required
                                            placeholder={`Select or enter ${dropOffLabel.toLowerCase()}`}
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50 text-sm sm:text-base"
                                            value={formData.dropOffLocation}
                                            onChange={(e) => setFormData({ ...formData, dropOffLocation: e.target.value })}
                                        />
                                    </div>

                                    <div>
                                        <label className="flex items-center gap-2 text-alorica-blue font-bold mb-2">
                                            <Icon name="clock" size={18} className="text-alorica-orange" /> {timeLabel}
                                        </label>
                                        <div className="rounded-xl border-2 border-gray-100 bg-gray-50 p-4">
                                            <div className="flex items-center justify-center font-mono font-bold text-alorica-blue mb-1">
                                                <span className="text-4xl sm:text-5xl">{displayHh}</span>
                                                <span className="text-4xl sm:text-5xl text-alorica-orange animate-pulse mx-1">:</span>
                                                <span className="text-4xl sm:text-5xl">{displayMm}</span>
                                            </div>
                                            <p className="text-center text-xs text-gray-400 mb-4">
                                                {formData.time ? 'Selected time' : 'Current time — pick yours below'}
                                            </p>
                                            <div className="grid grid-cols-2 gap-3 mb-3">
                                                <div>
                                                    <span className="block text-xs font-semibold text-gray-500 mb-1 text-center">Hour</span>
                                                    <select
                                                        className="w-full px-3 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white text-center font-semibold"
                                                        value={selHour}
                                                        onChange={(e) => setFormData({ ...formData, time: `${e.target.value}:${selMinute}` })}
                                                    >
                                                        {HOURS.map((h) => <option key={h} value={h}>{h}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <span className="block text-xs font-semibold text-gray-500 mb-1 text-center">Minute</span>
                                                    <select
                                                        className="w-full px-3 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white text-center font-semibold"
                                                        value={selMinute}
                                                        onChange={(e) => setFormData({ ...formData, time: `${selHour}:${e.target.value}` })}
                                                    >
                                                        {MINUTES.map((m) => <option key={m} value={m}>{m}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button
                                                    type="button"
                                                    onClick={() => setFormData({ ...formData, time: `${clock.hh}:${clock.mm}` })}
                                                    className="text-xs bg-alorica-light text-alorica-blue px-3 py-3 rounded-xl font-semibold hover:bg-blue-100 transition-colors whitespace-nowrap flex items-center gap-1 shrink-0"
                                                >
                                                    <Icon name="clock" size={14} /> Now
                                                </button>
                                                <select
                                                    required
                                                    className="flex-1 min-w-0 px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white"
                                                    value={formData.timeZone}
                                                    onChange={(e) => setFormData({ ...formData, timeZone: e.target.value })}
                                                >
                                                    <option value="">Select timezone</option>
                                                    {TIMEZONES.map((tz) => (
                                                        <option key={tz.value} value={tz.value}>{tz.label}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="flex items-center gap-2 text-alorica-blue font-bold mb-2">
                                            <Icon name="calendar" size={18} className="text-alorica-orange" /> Calendar
                                        </label>
                                        <input
                                            type="date"
                                            required
                                            min={todayISO()}
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50"
                                            value={formData.date}
                                            onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                                        />
                                    </div>

                                    <datalist id="fixed-locations">
                                        {FIXED_LOCATIONS.map((loc, index) => (
                                            <option key={index} value={loc} />
                                        ))}
                                    </datalist>

                                    <div className="pt-2">
                                        <button
                                            type="submit"
                                            disabled={locating}
                                            className={`w-full bg-alorica-orange hover:shadow-2xl text-white font-black text-xl py-5 rounded-2xl shadow-xl transform active:scale-[0.98] transition-all flex items-center justify-center gap-3 group ${locating ? 'opacity-70 cursor-wait' : ''}`}
                                        >
                                            {locating ? 'Detecting Location...' : 'Book now'}
                                            <Icon name="chevron-right" size={24} className="group-hover:translate-x-2 transition-transform" />
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                        )}
                    </main>

                    <footer className="mt-12 pb-8 text-center text-gray-500 text-sm">
                        <p>© 2026 Alorica Inc. All Rights Reserved.</p>
                    </footer>
                </div>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        // Enable offline use (requires http/https, ignored on file://)
        if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () {});
            });
        }
    </script>
</body>
</html>
