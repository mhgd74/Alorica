<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00385F">
    <meta name="description" content="Alorica employee transportation booking system">
    <title>Alorica Booking System</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2300385F'/%3E%3Ctext x='50' y='70' font-size='64' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23F58220'%3Ea%3C/text%3E%3C/svg%3E">

    <!-- Libraries are served locally so the system works on the company network / offline -->
    <script src="vendor/tailwind.js"></script>
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/babel.min.js"></script>
    <script src="vendor/lucide.js"></script>
    <script src="vendor/xlsx.bundle.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
        .alorica-blue { color: #00385F; }
        .bg-alorica-blue { background-color: #00385F; }
        .alorica-orange { color: #F58220; }
        .bg-alorica-orange { background-color: #F58220; }
        .bg-alorica-light { background-color: #E6F0F7; }

        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toast-in { animation: toastIn 0.25s ease-out; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        input:focus, select:focus {
            border-color: #F58220 !important;
            box-shadow: 0 0 0 2px rgba(245, 130, 32, 0.2) !important;
        }

        /* Hide default datalist arrow in some browsers */
        input::-webkit-calendar-picker-indicator {
            display: none !important;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        alorica: {
                            blue: '#00385F',
                            orange: '#F58220',
                            light: '#E6F0F7',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        /* =============================================================
         * 1. Configuration
         * ============================================================= */

        // Built-in accounts. Kept out of the UI on purpose.
        // role: 'admin' (full access) | 'teamlead' (review + edit bookings only) | 'user'
        const DEFAULT_USERS = [
            { username: 'admin', password: 'admin123', name: 'System Admin', role: 'admin' },
            { username: 'teamlead', password: 'lead123', name: 'Team Leader', role: 'teamlead' },
            { username: '7406173', password: 'pass123', name: 'Gomaa Abdelrahman', role: 'user' },
            { username: 'user2', password: 'pass456', name: 'Second User', role: 'user' }
        ];

        // Fixed pickup routes / points mapping from the provided schedule.
        const FIXED_LOCATIONS = {
            "R1": ["Hossary Station", "Al Nagda Square", "Farouq Omar School", "Vodafone Sq.", "Bashayer Entrance", "High Town Mall", "Masjid Othman Ebn Afaan", "Aeon Towers"],
            "R2": ["جهاز مدينة 6 أكتوبر الجديدة", "مخرج الربوة", "معهد معاوني الامن", "دخلة كمبوند سكن مصر _كمبوند المخابرات", "ميدان رامو", "مدخل المتميز", "صينية الحى السادس عشر ميدان البستان", "أسبانيا بلازا", "ميدان عمر الحناوي", "مستشفى الشيخ زايد التخصصي", "كوبري المشاه أمام هايبر وان الشيخ زايد"],
            "R3": ["Sawwaf Tersa", "Tersa Bridge", "Khofo Gate", "Ahmos Gate", "Mina Gate 4 (Hadayeq Al Ahram)", "Zewail Rd. (Wahat Rd.)", "Dreamland", "Souq Al Gomla"],
            "R4": ["El Monib - Matafy Stairs", "Khatem Al Morsaleen Mosque", "Cairo University Main Gate", "Awwal Faisal", "Maryam Pharmacy (Faisal St.)", "Haram Educational Administration", "Sahl Hamza", "Faisal St."],
            "R5": ["The National Museum of Egyptian Civilization", "Misr El Qadima Post Office", "Magra Al Eyoon", "Abd Al Moneim Riad", "EGYPTAIR Mohandessin", "Lebanon Sq."],
            "R6": ["Wattaneya Gas Station", "Saqr Quraish", "Total Zahraa Al Maadi (Autostrad)", "Policeman Institute St. (Nile Corniche)", "Total Gas Station-Ent.2", "Constitutional Court"],
            "R7": ["Saudi German Hospital Cairo", "El Nozha Metroline 3 Station", "Al Hegaz Square", "Heliopolis Courthouse Complex", "Al Helmeya Square", "Mostorod", "Al Sawah Square", "Al-Fath Mosque"],
            "R8": ["Al Nour Mosque (Nasr City)", "Marmina Church", "Abbas Al Akkad St. & Mostafa Al Nahas St.", "Vodafone (Saa Square)", "Hesham Barakat Bridge", "Al Sekka Al Hadid Sporting Club (Nasr City)", "Ghamra"],
            "R9": ["نزله مدينه الجديدة (Nasr City)", "مؤسسة الزكاة", "نزلة القلج", "نزلة المرج", "كوبري مسطرد", "نزلة طريق بنها الحر", "نزلة قليوب", "سلم باسوس", "الوراق", "محطة مترو الطريق الدائري", "نزلة بشتيل", "البراجيل", "سلم الرشاح", "سلم المساكن كفر طهرمس", "سلم المنشية"]
        };

        const ALL_POINTS = Object.values(FIXED_LOCATIONS).flat();

        // Default fleet — the admin can add / remove buses and change capacities.
        const DEFAULT_BUSES = [
            { id: 'bus-1', name: 'Bus 1', capacity: 14 },
            { id: 'bus-2', name: 'Bus 2', capacity: 14 },
            { id: 'bus-3', name: 'Bus 3', capacity: 26 }
        ];

        const WAITLIST = 'Waitlist';

        const STORAGE = {
            bookings: 'alorica_bookings',
            users: 'alorica_custom_users',
            buses: 'alorica_buses'
        };

        const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

        /* =============================================================
         * 2. Small helpers
         * ============================================================= */

        const ROLE_LABELS = { admin: 'Admin', teamlead: 'Team Leader', user: 'User' };

        // Accounts saved before roles existed fall back to admin/user by username.
        const roleOf = (user) => {
            if (!user) return 'user';
            if (user.role) return user.role;
            return user.username === 'admin' ? 'admin' : 'user';
        };

        const loadJSON = (key, fallback) => {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : fallback;
            } catch (e) {
                return fallback;
            }
        };

        const saveJSON = (key, value) => {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {
                /* storage full or unavailable */
            }
        };

        const pad = (n) => String(n).padStart(2, '0');

        // Local (not UTC) YYYY-MM-DD so the date picker never shifts by a day
        const todayISO = () => {
            const d = new Date();
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        };

        const to12h = (t24) => {
            if (!t24) return { hh: '', mm: '', ampm: 'AM' };
            const [h24, mm] = t24.split(':');
            const h = parseInt(h24, 10);
            return { hh: pad(h % 12 || 12), mm, ampm: h >= 12 ? 'PM' : 'AM' };
        };

        const formatTime12h = (t24) => {
            const { hh, mm, ampm } = to12h(t24);
            return hh ? `${hh}:${mm} ${ampm}` : '';
        };

        // Preset loading times per direction, grouped by shift.
        // Edit these values to match the official company shift schedule.
        const SHIFT_SLOTS = {
            arrival: [
                { shift: 'Morning Shift', times: ['06:30', '07:00'] },
                { shift: 'Evening Shift', times: ['14:30', '15:00'] },
                { shift: 'Night Shift', times: ['22:30', '23:00'] }
            ],
            departure: [
                { shift: 'Morning Shift', times: ['17:00', '17:30'] },
                { shift: 'Evening Shift', times: ['01:00', '01:30'] },
                { shift: 'Night Shift', times: ['08:00', '08:30'] }
            ]
        };

        const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));

        // Group bookings by day, sorted chronologically
        const groupByDay = (bookings) => {
            const byDay = {};
            bookings.forEach((b) => {
                const day = b.date || 'Unknown date';
                if (!byDay[day]) byDay[day] = [];
                byDay[day].push(b);
            });
            return Object.keys(byDay).sort().map((day) => ({ day, items: byDay[day] }));
        };

        const uniqueEmployeeCount = (list) => new Set(list.map((b) => b.employeeId)).size;

        /* =============================================================
         * 3. Bus distribution
         * ============================================================= */

        // Pick the first bus on that day that still has room, otherwise the waitlist.
        const assignBus = (booking, existing, buses) => {
            const used = {};
            buses.forEach((bus) => { used[bus.name] = 0; });
            existing
                .filter((b) => b.date === booking.date && b.bus && b.bus !== WAITLIST)
                .forEach((b) => { if (used[b.bus] != null) used[b.bus] += 1; });
            const bus = buses.find((b) => used[b.name] < b.capacity);
            return bus ? bus.name : WAITLIST;
        };

        // Re-run the automatic distribution for every day. Manual assignments are kept.
        const redistribute = (bookings, buses) => {
            const byDay = {};
            bookings.forEach((b) => { (byDay[b.date] = byDay[b.date] || []).push(b); });

            const next = {};
            Object.keys(byDay).forEach((day) => {
                const items = byDay[day].slice().sort((a, b) => String(a.time).localeCompare(String(b.time)));
                const used = {};
                buses.forEach((bus) => { used[bus.name] = 0; });

                items
                    .filter((b) => b.busManual && b.bus && b.bus !== WAITLIST && used[b.bus] != null)
                    .forEach((b) => { used[b.bus] += 1; });

                items.forEach((b) => {
                    if (b.busManual) return;
                    const bus = buses.find((x) => used[x.name] < x.capacity);
                    if (bus) {
                        next[b.id] = bus.name;
                        used[bus.name] += 1;
                    } else {
                        next[b.id] = WAITLIST;
                    }
                });
            });

            return bookings.map((b) => (next[b.id] ? { ...b, bus: next[b.id] } : b));
        };

        /* =============================================================
         * 4. Excel report (one sheet per day + a summary sheet)
         * ============================================================= */

        const THIN = { style: 'thin', color: { rgb: 'C9D6E2' } };
        const BORDER = { top: THIN, bottom: THIN, left: THIN, right: THIN };

        const TITLE_STYLE = {
            font: { bold: true, sz: 13, color: { rgb: 'FFFFFF' } },
            fill: { fgColor: { rgb: '00385F' } },
            alignment: { horizontal: 'center', vertical: 'center' }
        };
        const HEADER_STYLE = {
            font: { bold: true, sz: 11, color: { rgb: 'FFFFFF' } },
            fill: { fgColor: { rgb: 'F58220' } },
            alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
            border: BORDER
        };
        const BODY_STYLE = {
            font: { sz: 11, color: { rgb: '1F2937' } },
            alignment: { vertical: 'center' },
            border: BORDER
        };
        const WAITLIST_STYLE = {
            font: { sz: 11, bold: true, color: { rgb: 'B91C1C' } },
            alignment: { vertical: 'center' },
            border: BORDER
        };
        const TOTAL_STYLE = {
            font: { bold: true, sz: 11, color: { rgb: '00385F' } },
            fill: { fgColor: { rgb: 'E6F0F7' } },
            alignment: { vertical: 'center' },
            border: BORDER
        };

        const setCell = (ws, r, c, value, style) => {
            const addr = XLSX.utils.encode_cell({ r, c });
            const isNum = typeof value === 'number';
            ws[addr] = { v: value == null ? '' : value, t: isNum ? 'n' : 's', s: style };
        };

        const DAY_HEADERS = ['Employee Name', 'Employee ID', 'Booking Time', 'Pickup Point', 'Type', 'Bus'];

        const buildDaySheet = (day, items) => {
            const ws = {};
            const lastCol = DAY_HEADERS.length - 1;
            ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: items.length + 2, c: lastCol } });

            // Row 1 — title (merged)
            setCell(ws, 0, 0, `Alorica — Transportation Bookings — ${day}`, TITLE_STYLE);
            for (let c = 1; c <= lastCol; c++) setCell(ws, 0, c, '', TITLE_STYLE);

            // Row 2 — headers
            DAY_HEADERS.forEach((h, c) => setCell(ws, 1, c, h, HEADER_STYLE));

            // Data rows
            items.forEach((b, i) => {
                const r = i + 2;
                setCell(ws, r, 0, b.employeeName || '', BODY_STYLE);
                setCell(ws, r, 1, String(b.employeeId || ''), BODY_STYLE);
                setCell(ws, r, 2, b.time || '', BODY_STYLE);
                setCell(ws, r, 3, b.location || '', BODY_STYLE);
                setCell(ws, r, 4, b.type || '', BODY_STYLE);
                setCell(ws, r, 5, b.bus || '-', b.bus === WAITLIST ? WAITLIST_STYLE : BODY_STYLE);
            });

            // Total row
            const totalRow = items.length + 2;
            setCell(ws, totalRow, 0, 'Total bookings', TOTAL_STYLE);
            for (let c = 1; c < lastCol; c++) setCell(ws, totalRow, c, '', TOTAL_STYLE);
            setCell(ws, totalRow, lastCol, items.length, TOTAL_STYLE);

            ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: lastCol } }];
            ws['!cols'] = [{ wch: 28 }, { wch: 14 }, { wch: 14 }, { wch: 32 }, { wch: 12 }, { wch: 14 }];
            ws['!rows'] = [{ hpt: 24 }, { hpt: 20 }];
            ws['!autofilter'] = { ref: `A2:F${items.length + 2}` };
            return ws;
        };

        const buildSummarySheet = (bookings, buses) => {
            const groups = groupByDay(bookings);
            const busNames = buses.map((b) => b.name);
            const head = ['Day', 'Bookings', 'Employees', ...busNames, WAITLIST];
            const lastCol = head.length - 1;

            const titleRow = [`Alorica — Transportation Summary (${bookings.length} bookings)`];
            while (titleRow.length <= lastCol) titleRow.push('');

            const aoa = [
                titleRow,
                ['Generated', new Date().toLocaleString()],
                [],
                head
            ];

            groups.forEach(({ day, items }) => {
                const counts = {};
                busNames.forEach((n) => { counts[n] = 0; });
                let wait = 0;
                items.forEach((b) => {
                    if (!b.bus || b.bus === WAITLIST) wait += 1;
                    else if (counts[b.bus] != null) counts[b.bus] += 1;
                    else counts[b.bus] = 1;
                });
                aoa.push([day, items.length, uniqueEmployeeCount(items), ...busNames.map((n) => counts[n]), wait]);
            });

            aoa.push([
                'Total',
                bookings.length,
                uniqueEmployeeCount(bookings),
                ...busNames.map((n) => bookings.filter((b) => b.bus === n).length),
                bookings.filter((b) => !b.bus || b.bus === WAITLIST).length
            ]);

            const ws = XLSX.utils.aoa_to_sheet(aoa);
            ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: lastCol } }];
            ws['!cols'] = [{ wch: 18 }, { wch: 11 }, { wch: 11 }, ...busNames.map(() => ({ wch: 12 })), { wch: 11 }];

            const totalRow = aoa.length - 1;
            for (let r = 0; r <= totalRow; r++) {
                for (let c = 0; c <= lastCol; c++) {
                    const addr = XLSX.utils.encode_cell({ r, c });
                    if (!ws[addr]) continue;
                    if (r === 0) ws[addr].s = TITLE_STYLE;
                    else if (r === 3) ws[addr].s = HEADER_STYLE;
                    else if (r === totalRow) ws[addr].s = TOTAL_STYLE;
                    else ws[addr].s = BODY_STYLE;
                }
            }
            return ws;
        };

        const buildWorkbook = (bookings, buses) => {
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, buildSummarySheet(bookings, buses), 'Summary');
            groupByDay(bookings).forEach(({ day, items }) => {
                const safeName = String(day).replace(/[^\w-]/g, '-').slice(0, 31) || 'Sheet';
                XLSX.utils.book_append_sheet(wb, buildDaySheet(day, items), safeName);
            });
            return wb;
        };

        /* =============================================================
         * 5. Printable report
         * ============================================================= */

        const buildPrintHtml = (bookings) => {
            const groups = groupByDay(bookings);
            const sections = groups.map(({ day, items }) => `
                <section class="day">
                    <div class="day-head">
                        <h2>${esc(day)}</h2>
                        <span>${items.length} booking${items.length === 1 ? '' : 's'}</span>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th class="num">#</th>
                                <th>Employee Name</th>
                                <th>Employee ID</th>
                                <th>Booking Time</th>
                                <th>Pickup Point</th>
                                <th>Type</th>
                                <th>Bus</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map((b, i) => `
                            <tr>
                                <td class="num">${i + 1}</td>
                                <td>${esc(b.employeeName)}</td>
                                <td>${esc(b.employeeId)}</td>
                                <td>${esc(b.time)}</td>
                                <td>${esc(b.location)}</td>
                                <td>${esc(b.type)}</td>
                                <td class="${b.bus === WAITLIST ? 'wait' : ''}">${esc(b.bus || '-')}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </section>`).join('');

            return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alorica Transport Bookings</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; color: #1f2937; margin: 24px; }
    header { border-bottom: 3px solid #F58220; padding-bottom: 10px; margin-bottom: 20px; }
    header h1 { margin: 0; color: #00385F; font-size: 22px; }
    header p { margin: 6px 0 0; color: #6b7280; font-size: 12px; }
    .day { margin-bottom: 26px; page-break-inside: avoid; }
    .day:not(:last-child) { page-break-after: always; }
    .day-head { display: flex; justify-content: space-between; align-items: baseline; background: #00385F; color: #fff; padding: 8px 12px; border-radius: 6px 6px 0 0; }
    .day-head h2 { margin: 0; font-size: 15px; }
    .day-head span { font-size: 11px; opacity: .85; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #d1d5db; padding: 7px 9px; font-size: 12px; text-align: left; }
    thead th { background: #e6f0f7; color: #00385F; }
    tbody tr:nth-child(even) { background: #fafafa; }
    td.num, th.num { width: 34px; text-align: center; }
    td.wait { color: #b91c1c; font-weight: bold; }
    footer { margin-top: 24px; font-size: 11px; color: #9ca3af; text-align: center; }
    @page { margin: 14mm; }
</style>
</head>
<body>
    <header>
        <h1>Alorica &mdash; Employee Transportation Bookings</h1>
        <p>Generated: ${esc(new Date().toLocaleString())} &nbsp;|&nbsp; Total bookings: ${bookings.length} &nbsp;|&nbsp; Days: ${groups.length}</p>
    </header>
    ${sections || '<p>No bookings available.</p>'}
    <footer>&copy; 2026 Alorica Inc. All Rights Reserved.</footer>
</body>
</html>`;
        };

        /* =============================================================
         * 6. UI atoms
         * ============================================================= */

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const Toasts = ({ toasts }) => {
            const styles = {
                success: 'bg-green-50 text-green-800 border-green-200',
                error: 'bg-red-50 text-red-700 border-red-200',
                info: 'bg-alorica-light text-alorica-blue border-blue-200'
            };
            const icons = { success: 'check-circle', error: 'alert-circle', info: 'info' };
            return (
                <div className="fixed top-4 right-4 z-[100] space-y-2 w-[min(92vw,22rem)]">
                    {toasts.map((t) => (
                        <div key={t.id} className={`toast-in flex items-start gap-2 border rounded-xl shadow-lg px-4 py-3 text-sm font-medium ${styles[t.type] || styles.info}`}>
                            <Icon name={icons[t.type] || 'info'} size={18} className="mt-0.5 shrink-0" />
                            <span>{t.text}</span>
                        </div>
                    ))}
                </div>
            );
        };

        /* =============================================================
         * 7. Screens
         * ============================================================= */

        const Login = ({ toasts, loginData, setLoginData, error, onSubmit }) => (
            <>
                <Toasts toasts={toasts} />
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 fade-in">
                        <div className="flex flex-col items-center mb-8">
                            <img src="logo.png" alt="Alorica" className="h-12 mb-4" />
                            <h1 className="text-2xl font-bold text-alorica-blue">Login</h1>
                            <p className="text-gray-500 text-sm mt-2 text-center">Alorica Booking System</p>
                        </div>

                        <form onSubmit={onSubmit} className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Username</label>
                                <div className="relative">
                                    <input
                                        type="text"
                                        required
                                        autoComplete="username"
                                        className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg outline-none transition-all text-gray-800 pl-10"
                                        placeholder="Enter your username"
                                        value={loginData.username}
                                        onChange={(e) => setLoginData({ ...loginData, username: e.target.value })}
                                    />
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                        <Icon name="user" size={18} />
                                    </div>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <div className="relative">
                                    <input
                                        type="password"
                                        required
                                        autoComplete="current-password"
                                        className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg outline-none transition-all text-gray-800 pl-10"
                                        placeholder="Enter your password"

                    )}
                    </>
                )}

                {/* ================= BUSES ================= */}
                {adminView === 'buses' && (
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-alorica-light rounded-2xl p-6 mb-8">
                            <h3 className="flex items-center gap-2 text-alorica-blue font-bold text-lg mb-4">
                                <Icon name="bus" size={20} className="text-alorica-orange" /> Add a Bus
                            </h3>
                            <form onSubmit={onAddBus} className="space-y-4">
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div className="sm:col-span-2">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Bus name</label>
                                        <input
                                            required
                                            placeholder="e.g. Bus 4"
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white text-sm"
                                            value={newBus.name}
                                            onChange={(e) => { setBusFeedback({ type: '', text: '' }); setNewBus({ ...newBus, name: e.target.value }); }}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Seats (per day)</label>
                                        <input
                                            required
                                            type="number"
                                            min="1"
                                            placeholder="e.g. 14"
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white text-sm"
                                            value={newBus.capacity}
                                            onChange={(e) => { setBusFeedback({ type: '', text: '' }); setNewBus({ ...newBus, capacity: e.target.value }); }}
                                        />
                                    </div>
                                </div>

                                {busFeedback.text && (
                                    <p className={`text-sm font-medium rounded-xl px-4 py-3 border fade-in ${
                                        busFeedback.type === 'error'
                                            ? 'bg-red-50 text-red-600 border-red-100'
                                            : 'bg-green-50 text-green-700 border-green-100'
                                    }`}>
                                        {busFeedback.text}
                                    </p>
                                )}

                                <button
                                    type="submit"
                                    className="w-full bg-alorica-blue hover:bg-opacity-90 text-white font-bold py-4 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all"
                                >
                                    <Icon name="plus" size={20} /> Add Bus
                                </button>
                            </form>
                        </div>

                        <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                            <h3 className="text-alorica-blue font-bold text-lg">Fleet ({buses.length} buses)</h3>
                            <button
                                type="button"
                                onClick={onRedistribute}
                                className="text-xs font-semibold px-3 py-2 rounded-lg bg-white border border-alorica-blue text-alorica-blue hover:bg-alorica-light transition-colors flex items-center gap-1"
                            >
                                <Icon name="shuffle" size={14} /> Auto-assign buses
                            </button>
                        </div>

                        <div className="border border-gray-100 rounded-2xl overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm">
                                    <thead className="bg-alorica-light text-alorica-blue">
                                        <tr>
                                            <th className="text-left px-4 py-2 font-semibold">Bus</th>
                                            <th className="text-left px-4 py-2 font-semibold">Seats / day</th>
                                            <th className="text-left px-4 py-2 font-semibold">Assigned (all bookings)</th>
                                            <th className="text-center px-4 py-2 font-semibold">Remove</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {buses.length === 0 && (
                                            <tr><td colSpan="4" className="px-4 py-6 text-center text-gray-400">No buses yet. Add one above.</td></tr>
                                        )}
                                        {buses.map((bus) => (
                                            <tr key={bus.id} className="border-t border-gray-100">
                                                <td className="px-4 py-2 text-gray-800 font-semibold">{bus.name}</td>
                                                <td className="px-4 py-2">
                                                    <input
                                                        type="number"
                                                        min="1"
                                                        defaultValue={bus.capacity}
                                                        onBlur={(e) => onUpdateCapacity(bus.id, e.target.value)}
                                                        className="w-24 px-3 py-2 border-2 border-gray-100 rounded-lg outline-none bg-white text-sm"
                                                    />
                                                </td>
                                                <td className="px-4 py-2 text-gray-600">{busUsage[bus.name] || 0}</td>
                                                <td className="px-4 py-2 text-center">
                                                    <button
                                                        type="button"
                                                        onClick={() => onDeleteBus(bus.id)}
                                                        className="p-2 rounded-lg text-red-500 hover:bg-red-50 transition-colors"
                                                        title="Remove bus"
                                                    >
                                                        <Icon name="trash-2" size={16} />
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div className="bg-alorica-light rounded-2xl p-4 text-center">
                                <p className="text-2xl font-black text-alorica-blue">{buses.reduce((sum, b) => sum + b.capacity, 0)}</p>
                                <p className="text-xs text-gray-500 mt-1">Total seats per day</p>
                            </div>
                            <div className="bg-alorica-light rounded-2xl p-4 text-center">
                                <p className={`text-2xl font-black ${waitlistCount ? 'text-red-600' : 'text-alorica-blue'}`}>{waitlistCount}</p>
                                <p className="text-xs text-gray-500 mt-1">Bookings on waitlist</p>
                            </div>
                        </div>
                        <p className="text-xs text-gray-400 mt-4 text-center">
                            Capacity is applied per day. Bookings that do not fit any bus are placed on the waitlist and flagged in red.
                        </p>
                    </div>
                )}

                {/* ================= USERS ================= */}
                {adminView === 'users' && (
                    <div className="max-w-3xl mx-auto">
                        <div className="bg-alorica-light rounded-2xl p-6 mb-8">
                            <h3 className="flex items-center gap-2 text-alorica-blue font-bold text-lg mb-4">
                                <Icon name="user-plus" size={20} className="text-alorica-orange" /> Create New User
                            </h3>
                            <form onSubmit={onCreateUser} className="space-y-4">
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Full Name</label>
                                        <input
                                            required
                                            placeholder="e.g. Sara Mahmoud"
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white text-sm"
                                            value={newUser.name}
                                            onChange={(e) => { setUserFeedback({ type: '', text: '' }); setNewUser({ ...newUser, name: e.target.value }); }}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Username</label>
                                        <input
                                            required
                                            placeholder="e.g. sara"
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white text-sm"
                                            value={newUser.username}
                                            onChange={(e) => { setUserFeedback({ type: '', text: '' }); setNewUser({ ...newUser, username: e.target.value }); }}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Password</label>
                                        <input
                                            required
                                            placeholder="e.g. sara123"
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white text-sm"
                                            value={newUser.password}
                                            onChange={(e) => { setUserFeedback({ type: '', text: '' }); setNewUser({ ...newUser, password: e.target.value }); }}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Role</label>
                                        <select
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white text-sm"
                                            value={newUser.role}
                                            onChange={(e) => { setUserFeedback({ type: '', text: '' }); setNewUser({ ...newUser, role: e.target.value }); }}
                                        >
                                            <option value="user">Regular User</option>
                                            <option value="teamlead">Team Leader</option>
                                        </select>
                                    </div>
                                </div>

                                {userFeedback.text && (
                                    <p className={`text-sm font-medium rounded-xl px-4 py-3 border fade-in ${
                                        userFeedback.type === 'error'
                                            ? 'bg-red-50 text-red-600 border-red-100'
                                            : 'bg-green-50 text-green-700 border-green-100'
                                    }`}>
                                        {userFeedback.text}
                                    </p>
                                )}

                                <button
                                    type="submit"
                                    className="w-full bg-alorica-blue hover:bg-opacity-90 text-white font-bold py-4 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all"
                                >
                                    <Icon name="user-plus" size={20} /> Create User
                                </button>
                            </form>
                        </div>

                        <h3 className="text-alorica-blue font-bold text-lg mb-3">Existing Users ({allUsers.length})</h3>
                        <div className="border border-gray-100 rounded-2xl overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm">
                                    <thead className="bg-alorica-light text-alorica-blue">
                                        <tr>
                                            <th className="text-left px-4 py-2 font-semibold">Full Name</th>
                                            <th className="text-left px-4 py-2 font-semibold">Username</th>
                                            <th className="text-left px-4 py-2 font-semibold">Role</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {allUsers.map((u) => (
                                            <tr key={u.username} className="border-t border-gray-100">
                                                <td className="px-4 py-2 text-gray-800">{u.name}</td>
                                                <td className="px-4 py-2 text-gray-600">{u.username}</td>
                                                <td className="px-4 py-2">
                                                    <span className={`text-xs font-semibold px-2 py-1 rounded-full ${
                                                        roleOf(u) === 'admin' ? 'bg-alorica-light text-alorica-blue'
                                                            : roleOf(u) === 'teamlead' ? 'bg-orange-50 text-alorica-orange'
                                                            : 'bg-gray-100 text-gray-600'
                                                    }`}>
                                                        {ROLE_LABELS[roleOf(u)]}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <p className="text-xs text-gray-400 mt-4 text-center">
                            Pick "Regular User" for employees or "Team Leader" for reviewers. Team Leaders can review, edit and forward bookings but cannot export or print the sheet. Accounts are saved in this browser.
                        </p>

                        <div className="mt-10 bg-gray-50 border border-gray-100 rounded-2xl p-6">
                            <h3 className="flex items-center gap-2 text-alorica-blue font-bold text-lg mb-2">
                                <Icon name="database" size={20} className="text-alorica-orange" /> Data Backup &amp; Restore
                            </h3>
                            <p className="text-xs text-gray-500 mb-4">
                                Download a JSON file with all bookings, buses and user accounts — or restore a previous backup.
                            </p>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <button
                                    type="button"
                                    onClick={onExportBackup}
                                    className="bg-white border-2 border-alorica-blue text-alorica-blue font-bold py-3 px-4 rounded-xl hover:bg-alorica-light flex items-center justify-center gap-2 transition-all"
                                >
                                    <Icon name="download" size={18} /> Export backup
                                </button>
                                <label className={`bg-white border-2 border-gray-200 text-gray-700 font-bold py-3 px-4 rounded-xl cursor-pointer hover:bg-gray-100 flex items-center justify-center gap-2 transition-all ${importing ? 'opacity-70 cursor-wait' : ''}`}>
                                    <Icon name="upload" size={18} /> {importing ? 'Restoring...' : 'Restore backup'}
                                    <input
                                        type="file"
                                        accept="application/json,.json"
                                        className="hidden"
                                        onChange={(e) => {
                                            const file = e.target.files && e.target.files[0];
                                            e.target.value = '';
                                            if (!file) return;
                                            setImporting(true);
                                            onImportBackup(file);
                                        }}
                                    />
                                </label>
                            </div>
                        </div>
                    </div>
                )}

                </div>
            </div>
            );
        };

        const App = () => {
            /* ------------------ state ------------------ */
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [loginData, setLoginData] = useState({ username: '', password: '' });
            const [error, setError] = useState('');
            const [locating, setLocating] = useState(false);
            const [activeTab, setActiveTab] = useState('arrival');
            const [bookings, setBookings] = useState(() => loadJSON(STORAGE.bookings, []));
            const [customUsers, setCustomUsers] = useState(() => loadJSON(STORAGE.users, []));
            const [buses, setBuses] = useState(() => loadJSON(STORAGE.buses, DEFAULT_BUSES));
            const [adminView, setAdminView] = useState('bookings');
            const [newUser, setNewUser] = useState({ name: '', username: '', password: '', role: 'user' });
            const [newBus, setNewBus] = useState({ name: '', capacity: '' });
            const [userFeedback, setUserFeedback] = useState({ type: '', text: '' });
            const [busFeedback, setBusFeedback] = useState({ type: '', text: '' });
            const [sharing, setSharing] = useState(false);
            const [toasts, setToasts] = useState([]);
            const [filters, setFilters] = useState({ q: '', from: '', to: '' });
            const [importing, setImporting] = useState(false);
            const [selectedRoad, setSelectedRoad] = useState(null);

            const [formData, setFormData] = useState({
                dropOffLocation: '',
                time: '',
                date: todayISO()
            });

            /* ------------------ effects ------------------ */
            useEffect(() => { saveJSON(STORAGE.bookings, bookings); }, [bookings]);
            useEffect(() => { saveJSON(STORAGE.users, customUsers); }, [customUsers]);
            useEffect(() => { saveJSON(STORAGE.buses, buses); }, [buses]);

            /* ------------------ toasts ------------------ */
            const pushToast = (text, type = 'info') => {
                const id = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
                setToasts((prev) => [...prev, { id, text, type }]);
                setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 4500);
            };

            const refreshData = () => {
                setBookings(loadJSON(STORAGE.bookings, []));
                setCustomUsers(loadJSON(STORAGE.users, []));
                setBuses(loadJSON(STORAGE.buses, DEFAULT_BUSES));
                pushToast('Data refreshed successfully', 'success');
            };

            /* ------------------ auth ------------------ */
            const allUsers = DEFAULT_USERS.concat(customUsers);

            const handleLogin = (e) => {
                e.preventDefault();
                const user = allUsers.find(
                    (u) => u.username === loginData.username.trim() && u.password === loginData.password
                );
                if (user) {
                    setIsLoggedIn(true);
                    setCurrentUser(user);
                    setError('');
                    setLoginData({ username: '', password: '' });
                } else {
                    setError('Invalid username or password');
                }
            };

            /* ------------------ booking ------------------ */
            const handleBooking = (e) => {
                e.preventDefault();

                // Taken automatically from the signed-in account (DEFAULT_USERS or a custom user).
                const employeeName = (currentUser.name || '').trim();
                const employeeId = currentUser.username;
                const type = activeTab === 'arrival' ? 'Arrival' : 'Departure';
                const time = formData.time;
                const date = formData.date;

                if (!time) {
                    pushToast('Please select a time.', 'error');
                    return;
                }

                if (date < todayISO()) {
                    pushToast('The booking date cannot be in the past.', 'error');
                    return;
                }

                const dayExists = bookings.some(
                    (b) => b.employeeId === employeeId && b.date === date
                );
                if (dayExists) {
                    pushToast('You already have a booking for this day. Please delete it first if you want to change it.', 'error');
                    return;
                }

                const base = {
                    id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                    employeeName,
                    employeeId,
                    type,
                    location: formData.dropOffLocation.trim(),
                    time,
                    date,
                    createdBy: currentUser.username,
                    bookedAt: new Date().toISOString()
                };
                const booking = { ...base, bus: assignBus(base, bookings, buses) };

                setBookings((prev) => [...prev, booking]);
                pushToast(`Booking confirmed for ${employeeName} — ${date} at ${time} (${booking.bus}).`, 'success');
                setFormData((prev) => ({ ...prev, dropOffLocation: '', time: '' }));
                setSelectedRoad(null);
            };

            const userBookings = useMemo(() => {
                if (!currentUser) return [];
                return bookings.filter((b) => b.employeeId === currentUser.username)
                    .sort((a, b) => new Date(b.date + ' ' + b.time) - new Date(a.date + ' ' + a.time));
            }, [bookings, currentUser]);

            /* ------------------ admin: bookings ------------------ */
            const filteredBookings = useMemo(() => {
                const q = filters.q.trim().toLowerCase();
                return bookings.filter((b) => {
                    const date = b.date || '';
                    if (filters.from && date < filters.from) return false;
                    if (filters.to && date > filters.to) return false;
                    if (!q) return true;
                    return [b.employeeName, b.employeeId, b.location, b.bus, b.type]
                        .some((v) => String(v == null ? '' : v).toLowerCase().includes(q));
                });
            }, [bookings, filters]);

            const dayGroups = useMemo(() => groupByDay(filteredBookings), [filteredBookings]);
            const busNames = buses.map((b) => b.name);

            const busUsage = useMemo(() => {
                const map = {};
                buses.forEach((b) => { map[b.name] = 0; });
                bookings.forEach((b) => { if (b.bus && map[b.bus] != null) map[b.bus] += 1; });
                return map;
            }, [bookings, buses]);

            const waitlistCount = bookings.filter((b) => !b.bus || b.bus === WAITLIST).length;

            const exportFileName = () => {
                const stamp = (filters.from || filters.to)
                    ? `${filters.from || 'start'}_to_${filters.to || 'end'}`
                    : todayISO();
                return `Alorica_Bookings_${stamp}.xlsx`;
            };

            const buildFilteredWorkbook = () => buildWorkbook(filteredBookings, buses);

            const handleSaveExcel = () => {
                if (!filteredBookings.length) {
                    pushToast('There are no bookings to export for the current filters.', 'error');
                    return;
                }
                XLSX.writeFile(buildFilteredWorkbook(), exportFileName());
                pushToast(`Exported ${filteredBookings.length} bookings to ${exportFileName()}.`, 'success');
            };

            const handleShare = async () => {
                if (!filteredBookings.length) {
                    pushToast('There are no bookings to share for the current filters.', 'error');
                    return;
                }
                const wb = buildFilteredWorkbook();
                const fileName = exportFileName();
                const buffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const file = new File([buffer], fileName, { type: XLSX_MIME });

                setSharing(true);
                try {
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            files: [file],
                            title: 'Alorica Bookings',
                            text: 'Alorica employee transportation bookings'
                        });
                    } else {
                        XLSX.writeFile(wb, fileName);
                        pushToast('Direct file sharing is not supported on this device. The file was downloaded instead — share it from Downloads via WhatsApp, Telegram, Messenger or Bluetooth.', 'info');
                    }
                } catch (err) {
                    if (!err || err.name !== 'AbortError') {
                        pushToast('Sharing failed: ' + (err ? err.message : 'unknown error'), 'error');
                    }
                } finally {
                    setSharing(false);
                }
            };

            const shareSummaryText = () => {
                const groups = groupByDay(filteredBookings);
                const lines = [`Alorica — Employee Transportation`, `Bookings: ${filteredBookings.length} | Days: ${groups.length} | Employees: ${uniqueEmployeeCount(filteredBookings)}`];
                groups.forEach(({ day, items }) => lines.push(`${day}: ${items.length} booking(s)`));
                if (waitlistCount) lines.push(`Waitlisted: ${waitlistCount}`);
                return lines.join('\n');
            };

            const handlePrint = () => {
                if (!filteredBookings.length) {
                    pushToast('There are no bookings to print for the current filters.', 'error');
                    return;
                }
                const frame = document.createElement('iframe');
                frame.setAttribute('aria-hidden', 'true');
                frame.style.position = 'fixed';
                frame.style.right = '0';
                frame.style.bottom = '0';
                frame.style.width = '0';
                frame.style.height = '0';
                frame.style.border = '0';
                document.body.appendChild(frame);

                const win = frame.contentWindow;
                win.document.open();
                win.document.write(buildPrintHtml(filteredBookings));
                win.document.close();

                setTimeout(() => {
                    win.focus();
                    win.print();
                    setTimeout(() => document.body.removeChild(frame), 1500);
                }, 300);
            };

            const handleDeleteBooking = (id) => {
                const target = bookings.find((b) => b.id === id);
                if (!target) return;

                // Security check: admins and team leaders manage every booking; regular users only their own.
                const role = roleOf(currentUser);
                if (role === 'user' && target.employeeId !== currentUser.username) {
                    pushToast('You can only delete your own bookings.', 'error');
                    return;
                }

                if (!window.confirm(`Delete the booking for ${target.employeeName || 'this employee'} on ${target.date}?`)) return;
                setBookings((prev) => prev.filter((b) => b.id !== id));
                pushToast('Booking deleted.', 'success');
            };

            const handleSetBus = (id, busName) => {
                setBookings((prev) => prev.map((b) => (b.id === id ? { ...b, bus: busName, busManual: true } : b)));
                pushToast(`Bus updated to ${busName}.`, 'success');
            };

            const handleRedistribute = () => {
                if (!bookings.length) {
                    pushToast('There are no bookings to distribute.', 'error');
                    return;
                }
                setBookings((prev) => redistribute(prev, buses));
                pushToast('Buses re-distributed automatically (manual assignments kept).', 'success');
            };

            const resetFilters = () => setFilters({ q: '', from: '', to: '' });

            /* ------------------ team leader: forward bookings to the admin ------------------ */
            const handleSubmitToAdmin = () => {
                if (!filteredBookings.length) {
                    pushToast('There are no bookings to send.', 'error');
                    return;
                }
                const ids = new Set(filteredBookings.map((b) => b.id));
                const submittedAt = new Date().toISOString();
                const submittedBy = currentUser.name || currentUser.username;

                setBookings((prev) => prev.map((b) => (
                    ids.has(b.id) ? { ...b, submittedBy, submittedAt } : b
                )));
                pushToast(`${ids.size} booking(s) sent to the admin for final confirmation.`, 'success');
            };

            /* ------------------ admin: buses ------------------ */
            const handleAddBus = (e) => {
                e.preventDefault();
                const name = newBus.name.trim();
                const capacity = parseInt(newBus.capacity, 10);

                if (!name || !capacity || capacity < 1) {
                    setBusFeedback({ type: 'error', text: 'Please enter a bus name and a capacity of at least 1.' });
                    return;
                }
                if (buses.some((b) => b.name.toLowerCase() === name.toLowerCase())) {
                    setBusFeedback({ type: 'error', text: `A bus named "${name}" already exists.` });
                    return;
                }

                setBuses((prev) => [...prev, { id: `bus-${Date.now()}`, name, capacity }]);
                setNewBus({ name: '', capacity: '' });
                setBusFeedback({ type: 'success', text: `Bus "${name}" was added.` });
            };

            const handleDeleteBus = (id) => {
                const bus = buses.find((b) => b.id === id);
                if (!bus) return;
                if (!window.confirm(`Remove "${bus.name}"? Its bookings will move to "Waitlist".`)) return;
                setBuses((prev) => prev.filter((b) => b.id !== id));
                setBookings((prev) => prev.map((b) => (b.bus === bus.name ? { ...b, bus: WAITLIST, busManual: false } : b)));
                pushToast(`Bus "${bus.name}" removed.`, 'success');
            };

            const handleUpdateCapacity = (id, capacity) => {
                const value = parseInt(capacity, 10);
                if (!value || value < 1) return;
                setBuses((prev) => prev.map((b) => (b.id === id ? { ...b, capacity: value } : b)));
            };

            /* ------------------ admin: users ------------------ */
            const handleCreateUser = (e) => {
                e.preventDefault();
                const name = newUser.name.trim();
                const username = newUser.username.trim();
                const password = newUser.password.trim();

                if (!name || !username || !password) {
                    setUserFeedback({ type: 'error', text: 'Please fill in all fields.' });
                    return;
                }
                if (allUsers.some((u) => u.username.toLowerCase() === username.toLowerCase())) {
                    setUserFeedback({ type: 'error', text: `The username "${username}" is already used.` });
                    return;
                }

                const role = newUser.role === 'teamlead' ? 'teamlead' : 'user';
                setCustomUsers((prev) => [...prev, { name, username, password, role }]);
                setNewUser({ name: '', username: '', password: '', role: 'user' });
                setUserFeedback({ type: 'success', text: `${ROLE_LABELS[role]} "${username}" was created successfully.` });
            };

            /* ------------------ admin: backup ------------------ */
            const handleExportBackup = () => {
                const payload = {
                    exportedAt: new Date().toISOString(),
                    version: 1,
                    bookings,
                    customUsers,
                    buses
                };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Alorica_backup_${todayISO()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                pushToast('Backup file downloaded.', 'success');
            };

            const handleImportBackup = (file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const data = JSON.parse(reader.result);
                        if (Array.isArray(data.bookings)) setBookings(data.bookings);
                        if (Array.isArray(data.customUsers)) setCustomUsers(data.customUsers);
                        if (Array.isArray(data.buses) && data.buses.length) setBuses(data.buses);
                        pushToast('Backup restored successfully.', 'success');
                    } catch (err) {
                        pushToast('That file is not a valid Alorica backup.', 'error');
                    } finally {
                        setImporting(false);
                    }
                };
                reader.onerror = () => {
                    pushToast('Could not read the selected file.', 'error');
                    setImporting(false);
                };
                reader.readAsText(file);
            };

            /* ------------------ geolocation ------------------ */
            const getCurrentLocation = (field) => {
                if (!navigator.geolocation) {
                    pushToast('Geolocation is not supported by your browser.', 'error');
                    return;
                }
                setLocating(true);
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        setFormData((prev) => ({ ...prev, [field]: `Lat: ${latitude.toFixed(4)}, Lon: ${longitude.toFixed(4)}` }));
                        setLocating(false);
                        pushToast('Current location detected.', 'success');
                    },
                    (err) => {
                        let msg = 'An unknown error occurred.';
                        if (err.code === err.PERMISSION_DENIED) msg = 'Permission denied. Please enable location services.';
                        else if (err.code === err.POSITION_UNAVAILABLE) msg = 'Location information is unavailable.';
                        else if (err.code === err.TIMEOUT) msg = 'The request to get your location timed out.';
                        pushToast('Location error: ' + msg, 'error');
                        setLocating(false);
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            };

            /* ------------------ derived ------------------ */
            const dropOffLabel = activeTab === 'arrival' ? 'Pickup location' : 'Drop off location';
            const dropOffIcon = activeTab === 'arrival' ? 'map-pin' : 'navigation';
            const timeLabel = activeTab === 'arrival' ? 'Pickup time' : 'Drop-off time';

            const currentRole = roleOf(currentUser);
            const isAdmin = currentRole === 'admin';
            const isTeamLead = currentRole === 'teamlead';
            const filtersActive = Boolean(filters.q || filters.from || filters.to);
            // Team leaders only get the bookings view; fleet and user management stay with the admin.
            const adminTabs = [
                { key: 'bookings', label: isTeamLead ? 'Review Bookings' : 'Bookings', icon: 'calendar-check' },
                ...(isAdmin ? [
                    { key: 'buses', label: 'Buses', icon: 'bus' },
                    { key: 'users', label: 'Users', icon: 'users' }
                ] : [])
            ];

            /* ------------------ login screen ------------------ */
            if (!isLoggedIn) {
                return (
                    <Login
                        toasts={toasts}
                        loginData={loginData}
                        setLoginData={setLoginData}
                        error={error}
                        onSubmit={handleLogin}
                    />
                );
            }

            /* ------------------ main app ------------------ */
            return (
                <>
                <Toasts toasts={toasts} />
                <div className="min-h-screen bg-alorica-light">
                    <nav className="bg-white shadow-md px-4 sm:px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                        <img src="logo.png" alt="Alorica" className="h-8" />
                        <div className="flex items-center gap-3 sm:gap-4">
                            <div className="text-right">
                                <p className="text-sm font-bold text-alorica-blue">{currentUser.name}</p>
                                <p className="text-xs text-gray-500">{isAdmin ? 'Administrator' : isTeamLead ? 'Team Leader' : 'Welcome back'}</p>
                            </div>
                            {(isAdmin || isTeamLead) && (
                                <button
                                    onClick={refreshData}
                                    className="p-2 hover:bg-blue-50 rounded-full text-alorica-blue transition-colors"
                                    title="Refresh data"
                                >
                                    <Icon name="refresh-cw" size={22} />
                                </button>
                            )}
                            <button
                                onClick={() => { setIsLoggedIn(false); setCurrentUser(null); }}
                                className="p-2 hover:bg-red-50 rounded-full text-red-500 transition-colors"
                                title="Sign out"
                            >
                                <Icon name="log-out" size={24} />
                            </button>
                        </div>
                    </nav>

                    <main className={`${(isAdmin || isTeamLead) ? 'max-w-6xl' : 'max-w-4xl'} mx-auto p-4 sm:p-6 mt-6 sm:mt-8 fade-in`}>
                        {(isAdmin || isTeamLead) ? (
                        <AdminDashboard
                            adminView={adminView}
                            setAdminView={setAdminView}
                            adminTabs={adminTabs}
                            bookings={bookings}
                            filteredBookings={filteredBookings}
                            dayGroups={dayGroups}
                            waitlistCount={waitlistCount}
                            filters={filters}
                            setFilters={setFilters}
                            filtersActive={filtersActive}
                            resetFilters={resetFilters}
                            onRedistribute={handleRedistribute}
                            onSaveExcel={handleSaveExcel}
                            onShare={handleShare}
                            onPrint={handlePrint}
                            sharing={sharing}
                            summaryText={shareSummaryText}
                            pushToast={pushToast}
                            busNames={busNames}
                            onSetBus={handleSetBus}
                            onDeleteBooking={handleDeleteBooking}
                            buses={buses}
                            newBus={newBus}
                            setNewBus={setNewBus}
                            busFeedback={busFeedback}
                            setBusFeedback={setBusFeedback}
                            onAddBus={handleAddBus}
                            onDeleteBus={handleDeleteBus}
                            onUpdateCapacity={handleUpdateCapacity}
                            busUsage={busUsage}
                            newUser={newUser}
                            setNewUser={setNewUser}
                            userFeedback={userFeedback}
                            setUserFeedback={setUserFeedback}
                            onCreateUser={handleCreateUser}
                            allUsers={allUsers}
                            importing={importing}
                            setImporting={setImporting}
                            onExportBackup={handleExportBackup}
                            onImportBackup={handleImportBackup}
                            role={currentRole}
                            onSubmitToAdmin={handleSubmitToAdmin}
                        />
                        ) : (
                        /* ================= REGULAR USER ================= */
                        <div className="bg-white rounded-3xl shadow-2xl overflow-hidden border border-white">
                            <BookingForm
                                activeTab={activeTab}
                                setActiveTab={setActiveTab}
                                formData={formData}
                                setFormData={setFormData}
                                selectedRoad={selectedRoad}
                                setSelectedRoad={setSelectedRoad}
                                locating={locating}
                                onLocate={getCurrentLocation}
                                onSubmit={handleBooking}
                                dropOffLabel={dropOffLabel}
                                dropOffIcon={dropOffIcon}
                                timeLabel={timeLabel}
                            />
                            <MyBookings bookings={userBookings} onDelete={handleDeleteBooking} />
                        </div>
                        )}
                    </main>

                    <footer className="mt-12 pb-8 text-center text-gray-500 text-sm">
                        <p>© 2026 Alorica Inc. All Rights Reserved.</p>
                    </footer>
                </div>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        // Enable offline use (requires http/https, ignored on file://)
        if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () {});
            });
        }
    </script>
</body>
</html>
