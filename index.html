<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00385F">
    <meta name="description" content="Alorica employee transportation booking system">
    <title>Alorica Booking System</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512x512.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192x192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512x512.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <!-- Libraries are served locally so the system works on the company network / offline.
         xlsx is deliberately absent: it is only needed to export a report, so it is
         fetched by ensureXlsx() the first time one is requested instead of costing
         every visitor 415 KB on a page where they may never export anything. -->
    <script src="vendor/tailwind.js"></script>
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/lucide.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        alorica: {
                            blue: '#00385F',
                            orange: '#F58220',
                            light: '#E6F0F7',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <!-- The application lives in the modules under src/. They are compiled ahead
         of time from the .jsx sources beside them, so the browser runs plain
         JavaScript and Babel is a build-time tool rather than a 2.8 MB download
         for every visitor. Run "npm run build" after editing a .jsx file. -->
    <script type="module" src="src/main.js"></script>

    <script>
        // Enable offline use (requires http/https, ignored on file://)
        if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () {});
            });
        }
    </script>
</body>
</html>
