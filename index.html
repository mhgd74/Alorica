<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alorica Booking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .alorica-blue { color: #00385F; }
        .bg-alorica-blue { background-color: #00385F; }
        .alorica-orange { color: #F58220; }
        .bg-alorica-orange { background-color: #F58220; }
        .bg-alorica-light { background-color: #E6F0F7; }
        
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input:focus, select:focus {
            border-color: #F58220 !important;
            box-shadow: 0 0 0 2px rgba(245, 130, 32, 0.2) !important;
        }

        /* Hide default datalist arrow in some browsers */
        input::-webkit-calendar-picker-indicator {
            display: none !important;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        alorica: {
                            blue: '#00385F',
                            orange: '#F58220',
                            light: '#E6F0F7',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const DEFAULT_USERS = [
            { username: 'admin', password: 'admin123', name: 'System Admin' },
            { username: 'user1', password: 'pass123', name: 'First User' },
            { username: 'user2', password: 'pass456', name: 'Second User' }
        ];

        const FIXED_LOCATIONS = [
            "Alorica Site - Maadi",
            "Alorica Site - Smart Village",
            "Cairo International Airport",
            "City Center Maadi",
            "Downtown Cairo",
            "New Cairo - 5th Settlement",
            "6th of October City",
            "Alexandria - City Center"
        ];

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [loginData, setLoginData] = useState({ username: '', password: '' });
            const [error, setError] = useState('');
            const [locating, setLocating] = useState(false);
            
            const [formData, setFormData] = useState({
                arrival: '',
                departure: '',
                dropOffLocation: '',
                timeZone: '',
                date: new Date().toISOString().split('T')[0],
            });

            const handleLogin = (e) => {
                e.preventDefault();
                const user = DEFAULT_USERS.find(
                    u => u.username === loginData.username && u.password === loginData.password
                );
                
                if (user) {
                    setIsLoggedIn(true);
                    setCurrentUser(user);
                    setError('');
                } else {
                    setError('Invalid username or password');
                }
            };

            const handleBooking = (e) => {
                e.preventDefault();
                
                const dataToExport = [{
                    'User Name': currentUser.name,
                    'Arrival': formData.arrival,
                    'Departure': formData.departure,
                    'Drop off location': formData.dropOffLocation,
                    'Time zone': formData.timeZone,
                    'Date': formData.date,
                    'Booking Time': new Date().toLocaleString()
                }];

                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(dataToExport);
                XLSX.utils.book_append_sheet(wb, ws, "Bookings");
                XLSX.writeFile(wb, `Alorica_Booking_${formData.arrival}.xlsx`);
                
                alert('Booking saved successfully and exported to Excel');
            };

            const getCurrentLocation = (field) => {
                if (!navigator.geolocation) {
                    alert("Geolocation is not supported by your browser");
                    return;
                }

                setLocating(true);
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        const locationStr = `Lat: ${latitude.toFixed(4)}, Lon: ${longitude.toFixed(4)}`;
                        setFormData(prev => ({ ...prev, [field]: locationStr }));
                        setLocating(false);
                    },
                    (error) => {
                        let msg = "";
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                msg = "Permission denied. Please enable location services.";
                                break;
                            case error.POSITION_UNAVAILABLE:
                                msg = "Location information is unavailable.";
                                break;
                            case error.TIMEOUT:
                                msg = "The request to get user location timed out.";
                                break;
                            default:
                                msg = "An unknown error occurred.";
                                break;
                        }
                        alert("Error: " + msg);
                        setLocating(false);
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 fade-in">
                            <div className="flex flex-col items-center mb-8">
                                <img src="https://alorica.com/wp-content/uploads/2026/04/header-logo.png" alt="Alorica" className="h-12 mb-4" />
                                <h1 className="text-2xl font-bold text-alorica-blue">Login</h1>
                                <p className="text-gray-500 text-sm mt-2 text-center">Alorica Booking System</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Username</label>
                                    <div className="relative">
                                        <input
                                            type="text"
                                            required
                                            className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg outline-none transition-all text-gray-800 pl-10"
                                            placeholder="Enter your username"
                                            value={loginData.username}
                                            onChange={(e) => setLoginData({...loginData, username: e.target.value})}
                                        />
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                            <Icon name="user" size={18} />
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <div className="relative">
                                        <input
                                            type="password"
                                            required
                                            className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg outline-none transition-all text-gray-800 pl-10"
                                            placeholder="Enter your password"
                                            value={loginData.password}
                                            onChange={(e) => setLoginData({...loginData, password: e.target.value})}
                                        />
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                            <Icon name="lock" size={18} />
                                        </div>
                                    </div>
                                </div>

                                {error && (
                                    <p className="text-red-500 text-sm text-center font-medium bg-red-50 py-2 rounded-lg">{error}</p>
                                )}

                                <button
                                    type="submit"
                                    className="w-full bg-alorica-blue hover:bg-opacity-90 text-white font-bold py-3 px-4 rounded-lg shadow-lg flex items-center justify-center gap-2 transition-all"
                                >
                                    Login
                                    <Icon name="chevron-right" size={20} />
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-alorica-light">
                    <nav className="bg-white shadow-md px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                        <img src="https://alorica.com/wp-content/uploads/2026/04/header-logo.png" alt="Alorica" className="h-8" />
                        <div className="flex items-center gap-4">
                            <div className="text-right">
                                <p className="text-sm font-bold text-alorica-blue">{currentUser.name}</p>
                                <p className="text-xs text-gray-500">Welcome back</p>
                            </div>
                            <button 
                                onClick={() => setIsLoggedIn(false)}
                                className="p-2 hover:bg-red-50 rounded-full text-red-500 transition-colors"
                            >
                                <Icon name="log-out" size={24} />
                            </button>
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto p-6 mt-8 fade-in">
                        <div className="bg-white rounded-3xl shadow-2xl overflow-hidden border border-white">
                            <div className="bg-alorica-blue p-8 text-white text-center">
                                <h2 className="text-3xl font-bold mb-2">Appointment Booking System</h2>
                                <p className="opacity-80">Please fill in the details below to complete your booking</p>
                            </div>

                            <form onSubmit={handleBooking} className="p-4 sm:p-8 grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
                                <div className="space-y-6">
                                    {/* Arrival Field */}
                                    <div>
                                        <label className="flex flex-wrap items-center justify-between text-alorica-blue font-bold mb-2 gap-2">
                                            <span className="flex items-center gap-2"><Icon name="map-pin" size={18} className="text-alorica-orange" /> Arrival</span>
                                            <button 
                                                type="button" 
                                                onClick={() => getCurrentLocation('arrival')}
                                                className="text-[10px] sm:text-xs bg-alorica-light text-alorica-blue px-2 py-1 rounded hover:bg-blue-100 transition-colors flex items-center gap-1 shrink-0"
                                            >
                                                <Icon name="locate" size={12} /> My Location
                                            </button>
                                        </label>
                                        <input
                                            list="fixed-locations"
                                            required
                                            placeholder="Select or enter arrival point"
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50 text-sm sm:text-base"
                                            value={formData.arrival}
                                            onChange={(e) => setFormData({...formData, arrival: e.target.value})}
                                        />
                                    </div>

                                    {/* Departure Field */}
                                    <div>
                                        <label className="flex flex-wrap items-center justify-between text-alorica-blue font-bold mb-2 gap-2">
                                            <span className="flex items-center gap-2"><Icon name="map-pin" size={18} className="text-alorica-orange" /> Departure</span>
                                            <button 
                                                type="button" 
                                                onClick={() => getCurrentLocation('departure')}
                                                className="text-[10px] sm:text-xs bg-alorica-light text-alorica-blue px-2 py-1 rounded hover:bg-blue-100 transition-colors flex items-center gap-1 shrink-0"
                                            >
                                                <Icon name="locate" size={12} /> My Location
                                            </button>
                                        </label>
                                        <input
                                            list="fixed-locations"
                                            required
                                            placeholder="Select or enter departure point"
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50 text-sm sm:text-base"
                                            value={formData.departure}
                                            onChange={(e) => setFormData({...formData, departure: e.target.value})}
                                        />
                                    </div>

                                    {/* Drop off location Field */}
                                    <div>
                                        <label className="flex flex-wrap items-center justify-between text-alorica-blue font-bold mb-2 gap-2">
                                            <span className="flex items-center gap-2"><Icon name="navigation" size={18} className="text-alorica-orange" /> Drop off location</span>
                                            <button 
                                                type="button" 
                                                onClick={() => getCurrentLocation('dropOffLocation')}
                                                className="text-[10px] sm:text-xs bg-alorica-light text-alorica-blue px-2 py-1 rounded hover:bg-blue-100 transition-colors flex items-center gap-1 shrink-0"
                                            >
                                                <Icon name="locate" size={12} /> My Location
                                            </button>
                                        </label>
                                        <input
                                            list="fixed-locations"
                                            required
                                            placeholder="Select or enter drop off location"
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50 text-sm sm:text-base"
                                            value={formData.dropOffLocation}
                                            onChange={(e) => setFormData({...formData, dropOffLocation: e.target.value})}
                                        />
                                    </div>

                                    <datalist id="fixed-locations">
                                        {FIXED_LOCATIONS.map((loc, index) => (
                                            <option key={index} value={loc} />
                                        ))}
                                    </datalist>
                                </div>

                                <div className="space-y-6">
                                    <div>
                                        <label className="flex items-center gap-2 text-alorica-blue font-bold mb-2">
                                            <Icon name="globe" size={18} className="text-alorica-orange" /> Time zone
                                        </label>
                                        <select
                                            required
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50"
                                            value={formData.timeZone}
                                            onChange={(e) => setFormData({...formData, timeZone: e.target.value})}
                                        >
                                            <option value="">Select timezone</option>
                                            <option value="GMT+2">Cairo (GMT+2)</option>
                                            <option value="GMT">London (GMT)</option>
                                            <option value="GMT-5">New York (GMT-5)</option>
                                            <option value="GMT+8">Dubai (GMT+4)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="flex items-center gap-2 text-alorica-blue font-bold mb-2">
                                            <Icon name="calendar" size={18} className="text-alorica-orange" /> Calendar
                                        </label>
                                        <input 
                                            type="date" 
                                            required
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50"
                                            value={formData.date}
                                            onChange={(e) => setFormData({...formData, date: e.target.value})}
                                        />
                                    </div>
                                </div>

                                <div className="md:col-span-2 mt-4">
                                    <button
                                        type="submit"
                                        disabled={locating}
                                        className={`w-full bg-alorica-orange hover:shadow-2xl text-white font-black text-xl py-5 rounded-2xl shadow-xl transform active:scale-[0.98] transition-all flex items-center justify-center gap-3 group ${locating ? 'opacity-70 cursor-wait' : ''}`}
                                    >
                                        {locating ? 'Detecting Location...' : 'Book now'}
                                        <Icon name="chevron-right" size={24} className="group-hover:translate-x-2 transition-transform" />
                                    </button>
                                </div>
                            </form>
                        </div>
                    </main>

                    <footer className="mt-12 pb-8 text-center text-gray-500 text-sm">
                        <p>© 2026 Alorica Inc. All Rights Reserved.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
