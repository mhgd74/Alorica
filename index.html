<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alorica Booking System</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2300385F'/%3E%3Ctext x='50' y='70' font-size='64' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23F58220'%3Ea%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .alorica-blue { color: #00385F; }
        .bg-alorica-blue { background-color: #00385F; }
        .alorica-orange { color: #F58220; }
        .bg-alorica-orange { background-color: #F58220; }
        .bg-alorica-light { background-color: #E6F0F7; }
        
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input:focus, select:focus {
            border-color: #F58220 !important;
            box-shadow: 0 0 0 2px rgba(245, 130, 32, 0.2) !important;
        }

        /* Hide default datalist arrow in some browsers */
        input::-webkit-calendar-picker-indicator {
            display: none !important;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        alorica: {
                            blue: '#00385F',
                            orange: '#F58220',
                            light: '#E6F0F7',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const DEFAULT_USERS = [
            { username: 'admin', password: 'admin123', name: 'System Admin' },
            { username: 'user1', password: 'pass123', name: 'First User' },
            { username: 'user2', password: 'pass456', name: 'Second User' }
        ];

        const FIXED_LOCATIONS = [
            "R1",
            "R2",
            "R3",
            "R4",
            "R5",
            "R6",
            "R7",
            "R8",
            "R9"
        ];

        const getOffsetHours = (tz) => {
            if (!tz) return -(new Date().getTimezoneOffset() / 60);
            const m = tz.match(/GMT\s*([+-]\d+)?/);
            if (!m || !m[1]) return 0;
            return parseInt(m[1], 10);
        };

        const formatClock = (date, offset) => {
            const z = new Date(date.getTime() + offset * 3600000);
            return {
                hh: String(z.getUTCHours()).padStart(2, '0'),
                mm: String(z.getUTCMinutes()).padStart(2, '0'),
                ss: String(z.getUTCSeconds()).padStart(2, '0'),
            };
        };

        const HOURS = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
        const MINUTES = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0'));

        const STORAGE_KEY = 'alorica_bookings';
        const USERS_STORAGE_KEY = 'alorica_custom_users';
        const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

        const loadBookings = () => {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        };

        // Users created by the admin (stored locally in the browser)
        const loadCustomUsers = () => {
            try {
                const raw = localStorage.getItem(USERS_STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        };

        const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));

        // Group bookings by day and return them sorted chronologically
        const groupByDay = (bookings) => {
            const byDay = {};
            bookings.forEach((b) => {
                const day = b.date || 'Unknown date';
                if (!byDay[day]) byDay[day] = [];
                byDay[day].push(b);
            });
            return Object.keys(byDay).sort().map((day) => ({ day, items: byDay[day] }));
        };

        // Build a workbook with one sheet per day of the month
        const buildWorkbook = (bookings) => {
            const wb = XLSX.utils.book_new();
            groupByDay(bookings).forEach(({ day, items }) => {
                const rows = items.map((b) => ({
                    'Employee Name': b.employeeName,
                    'Employee ID': b.employeeId,
                    'Booking Time': b.time,
                    'Pickup Point': b.location,
                    'Type': b.type,
                }));
                const ws = XLSX.utils.json_to_sheet(rows);
                ws['!cols'] = [{ wch: 26 }, { wch: 16 }, { wch: 15 }, { wch: 34 }, { wch: 12 }];
                const safeName = String(day).replace(/[^\w-]/g, '-').slice(0, 31) || 'Sheet';
                XLSX.utils.book_append_sheet(wb, ws, safeName);
            });
            return wb;
        };

        // Build a printable HTML report (one section per day)
        const buildPrintHtml = (bookings) => {
            const groups = groupByDay(bookings);
            const sections = groups.map(({ day, items }) => `
                <section class="day">
                    <div class="day-head">
                        <h2>${esc(day)}</h2>
                        <span>${items.length} booking${items.length === 1 ? '' : 's'}</span>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th class="num">#</th>
                                <th>Employee Name</th>
                                <th>Employee ID</th>
                                <th>Booking Time</th>
                                <th>Pickup Point</th>
                                <th>Type</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map((b, i) => `
                            <tr>
                                <td class="num">${i + 1}</td>
                                <td>${esc(b.employeeName)}</td>
                                <td>${esc(b.employeeId)}</td>
                                <td>${esc(b.time)}</td>
                                <td>${esc(b.location)}</td>
                                <td>${esc(b.type)}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </section>`).join('');

            return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alorica Transport Bookings</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; color: #1f2937; margin: 24px; }
    header { border-bottom: 3px solid #F58220; padding-bottom: 10px; margin-bottom: 20px; }
    header h1 { margin: 0; color: #00385F; font-size: 22px; }
    header p { margin: 6px 0 0; color: #6b7280; font-size: 12px; }
    .day { margin-bottom: 26px; page-break-inside: avoid; }
    .day:not(:last-child) { page-break-after: always; }
    .day-head { display: flex; justify-content: space-between; align-items: baseline; background: #00385F; color: #fff; padding: 8px 12px; border-radius: 6px 6px 0 0; }
    .day-head h2 { margin: 0; font-size: 15px; }
    .day-head span { font-size: 11px; opacity: .85; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #d1d5db; padding: 7px 9px; font-size: 12px; text-align: left; }
    thead th { background: #e6f0f7; color: #00385F; }
    tbody tr:nth-child(even) { background: #fafafa; }
    td.num, th.num { width: 34px; text-align: center; }
    footer { margin-top: 24px; font-size: 11px; color: #9ca3af; text-align: center; }
    @page { margin: 14mm; }
</style>
</head>
<body>
    <header>
        <h1>Alorica &mdash; Employee Transportation Bookings</h1>
        <p>Generated: ${esc(new Date().toLocaleString())} &nbsp;|&nbsp; Total bookings: ${bookings.length} &nbsp;|&nbsp; Days: ${groups.length}</p>
    </header>
    ${sections || '<p>No bookings available.</p>'}
    <footer>&copy; 2026 Alorica Inc. All Rights Reserved.</footer>
</body>
</html>`;
        };

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [loginData, setLoginData] = useState({ username: '', password: '' });
            const [error, setError] = useState('');
            const [locating, setLocating] = useState(false);
            const [activeTab, setActiveTab] = useState('arrival');
            const [now, setNow] = useState(new Date());
            const [bookings, setBookings] = useState(() => loadBookings());
            const [customUsers, setCustomUsers] = useState(() => loadCustomUsers());
            const [adminView, setAdminView] = useState('bookings');
            const [newUser, setNewUser] = useState({ name: '', username: '', password: '' });
            const [userFeedback, setUserFeedback] = useState({ type: '', text: '' });
            const [savedMsg, setSavedMsg] = useState('');
            const [sharing, setSharing] = useState(false);

            const [formData, setFormData] = useState({
                employeeName: '',
                employeeId: '',
                dropOffLocation: '',
                timeZone: '',
                time: '',
                date: new Date().toISOString().split('T')[0],
            });

            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Persist all bookings so the admin can export them later
            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
            }, [bookings]);

            // Persist the users created by the admin
            useEffect(() => {
                localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(customUsers));
            }, [customUsers]);

            const allUsers = DEFAULT_USERS.concat(customUsers);

            const handleLogin = (e) => {
                e.preventDefault();
                const user = allUsers.find(
                    u => u.username === loginData.username && u.password === loginData.password
                );
                
                if (user) {
                    setIsLoggedIn(true);
                    setCurrentUser(user);
                    setError('');
                } else {
                    setError('Invalid username or password');
                }
            };

            const handleBooking = (e) => {
                e.preventDefault();

                const booking = {
                    id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                    employeeName: formData.employeeName.trim(),
                    employeeId: formData.employeeId.trim(),
                    type: activeTab === 'arrival' ? 'Arrival' : 'Departure',
                    location: formData.dropOffLocation.trim(),
                    timeZone: formData.timeZone,
                    time: formData.time || `${clock.hh}:${clock.mm}`,
                    date: formData.date,
                    createdBy: currentUser.username,
                    bookedAt: new Date().toISOString(),
                };

                setBookings((prev) => [...prev, booking]);
                setSavedMsg(`Booking confirmed for ${booking.employeeName} on ${booking.date} at ${booking.time}.`);
                setTimeout(() => setSavedMsg(''), 6000);
                setFormData((prev) => ({
                    ...prev,
                    employeeName: '',
                    employeeId: '',
                    dropOffLocation: '',
                    time: '',
                }));
            };

            const exportFileName = () => `Alorica_Bookings_${new Date().toISOString().split('T')[0]}.xlsx`;

            // Admin: create a new user account
            const handleCreateUser = (e) => {
                e.preventDefault();
                const name = newUser.name.trim();
                const username = newUser.username.trim();
                const password = newUser.password.trim();

                if (!name || !username || !password) {
                    setUserFeedback({ type: 'error', text: 'Please fill in all fields.' });
                    return;
                }
                const taken = allUsers.some(u => u.username.toLowerCase() === username.toLowerCase());
                if (taken) {
                    setUserFeedback({ type: 'error', text: `The username "${username}" is already used.` });
                    return;
                }

                setCustomUsers((prev) => [...prev, { name, username, password }]);
                setNewUser({ name: '', username: '', password: '' });
                setUserFeedback({ type: 'success', text: `User "${username}" was created successfully.` });
            };

            // 1) Save — build the Excel file (one sheet per day) and download it
            const handleSaveExcel = () => {
                if (!bookings.length) {
                    alert('There are no bookings to export yet.');
                    return;
                }
                XLSX.writeFile(buildWorkbook(bookings), exportFileName());
            };

            // 2) Share — send the Excel file to WhatsApp / Telegram / Messenger / Bluetooth...
            const handleShare = async () => {
                if (!bookings.length) {
                    alert('There are no bookings to share yet.');
                    return;
                }
                const wb = buildWorkbook(bookings);
                const fileName = exportFileName();
                const buffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const file = new File([buffer], fileName, { type: XLSX_MIME });

                setSharing(true);
                try {
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            files: [file],
                            title: 'Alorica Bookings',
                            text: 'Alorica employee transportation bookings',
                        });
                    } else {
                        XLSX.writeFile(wb, fileName);
                        alert('Direct file sharing is not supported on this device. The file has been downloaded instead — you can share it from your downloads via WhatsApp, Telegram, Messenger or Bluetooth.');
                    }
                } catch (err) {
                    if (!err || err.name !== 'AbortError') {
                        alert('Sharing failed: ' + (err ? err.message : 'unknown error'));
                    }
                } finally {
                    setSharing(false);
                }
            };

            // 3) Print — print the report directly (one page per day)
            const handlePrint = () => {
                if (!bookings.length) {
                    alert('There are no bookings to print yet.');
                    return;
                }
                const frame = document.createElement('iframe');
                frame.setAttribute('aria-hidden', 'true');
                frame.style.position = 'fixed';
                frame.style.right = '0';
                frame.style.bottom = '0';
                frame.style.width = '0';
                frame.style.height = '0';
                frame.style.border = '0';
                document.body.appendChild(frame);

                const win = frame.contentWindow;
                win.document.open();
                win.document.write(buildPrintHtml(bookings));
                win.document.close();

                setTimeout(() => {
                    win.focus();
                    win.print();
                    setTimeout(() => document.body.removeChild(frame), 1500);
                }, 300);
            };

            const getCurrentLocation = (field) => {
                if (!navigator.geolocation) {
                    alert("Geolocation is not supported by your browser");
                    return;
                }

                setLocating(true);
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        const locationStr = `Lat: ${latitude.toFixed(4)}, Lon: ${longitude.toFixed(4)}`;
                        setFormData(prev => ({ ...prev, [field]: locationStr }));
                        setLocating(false);
                    },
                    (error) => {
                        let msg = "";
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                msg = "Permission denied. Please enable location services.";
                                break;
                            case error.POSITION_UNAVAILABLE:
                                msg = "Location information is unavailable.";
                                break;
                            case error.TIMEOUT:
                                msg = "The request to get user location timed out.";
                                break;
                            default:
                                msg = "An unknown error occurred.";
                                break;
                        }
                        alert("Error: " + msg);
                        setLocating(false);
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            };

            const clock = formatClock(now, getOffsetHours(formData.timeZone));
            const dropOffLabel = activeTab === 'arrival' ? 'Pickup location' : 'Drop off location';
            const dropOffIcon = activeTab === 'arrival' ? 'map-pin' : 'navigation';
            const timeLabel = activeTab === 'arrival' ? 'Pickup time' : 'Drop-off time';
            const timeParts = formData.time ? formData.time.split(':') : [clock.hh, clock.mm];
            const selHour = timeParts[0];
            const selMinute = timeParts[1];
            const displayTime = formData.time || `${clock.hh}:${clock.mm}`;
            const [displayHh, displayMm] = displayTime.split(':');

            const isAdmin = currentUser && currentUser.username === 'admin';
            const dayGroups = groupByDay(bookings);
            const uniqueEmployees = new Set(bookings.map((b) => b.employeeId)).size;

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 fade-in">
                            <div className="flex flex-col items-center mb-8">
                                <img src="logo.png" alt="Alorica" className="h-12 mb-4" />
                                <h1 className="text-2xl font-bold text-alorica-blue">Login</h1>
                                <p className="text-gray-500 text-sm mt-2 text-center">Alorica Booking System</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Username</label>
                                    <div className="relative">
                                        <input
                                            type="text"
                                            required
                                            className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg outline-none transition-all text-gray-800 pl-10"
                                            placeholder="Enter your username"
                                            value={loginData.username}
                                            onChange={(e) => setLoginData({...loginData, username: e.target.value})}
                                        />
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                            <Icon name="user" size={18} />
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <div className="relative">
                                        <input
                                            type="password"
                                            required
                                            className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg outline-none transition-all text-gray-800 pl-10"
                                            placeholder="Enter your password"
                                            value={loginData.password}
                                            onChange={(e) => setLoginData({...loginData, password: e.target.value})}
                                        />
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                            <Icon name="lock" size={18} />
                                        </div>
                                    </div>
                                </div>

                                {error && (
                                    <p className="text-red-500 text-sm text-center font-medium bg-red-50 py-2 rounded-lg">{error}</p>
                                )}

                                <button
                                    type="submit"
                                    className="w-full bg-alorica-blue hover:bg-opacity-90 text-white font-bold py-3 px-4 rounded-lg shadow-lg flex items-center justify-center gap-2 transition-all"
                                >
                                    Login
                                    <Icon name="chevron-right" size={20} />
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-alorica-light">
                    <nav className="bg-white shadow-md px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                        <img src="logo.png" alt="Alorica" className="h-8" />
                        <div className="flex items-center gap-4">
                            <div className="text-right">
                                <p className="text-sm font-bold text-alorica-blue">{currentUser.name}</p>
                                <p className="text-xs text-gray-500">Welcome back</p>
                            </div>
                            <button 
                                onClick={() => setIsLoggedIn(false)}
                                className="p-2 hover:bg-red-50 rounded-full text-red-500 transition-colors"
                            >
                                <Icon name="log-out" size={24} />
                            </button>
                        </div>
                    </nav>

                    <main className={`${isAdmin ? 'max-w-5xl' : 'max-w-4xl'} mx-auto p-6 mt-8 fade-in`}>
                        {isAdmin ? (
                        <div className="bg-white rounded-3xl shadow-2xl overflow-hidden border border-white">
                            <div className="bg-alorica-blue p-8 text-white text-center">
                                <h2 className="text-3xl font-bold mb-2">Admin Dashboard</h2>
                                <p className="opacity-80">Manage employee bookings and user accounts</p>
                            </div>

                            <div className="flex justify-center gap-3 pt-6 px-4">
                                <button
                                    type="button"
                                    onClick={() => setAdminView('bookings')}
                                    className={`flex items-center gap-2 px-6 sm:px-10 py-3 rounded-xl font-bold text-sm sm:text-base transition-all ${
                                        adminView === 'bookings'
                                            ? 'bg-alorica-orange text-white shadow-lg scale-105'
                                            : 'bg-gray-100 text-alorica-blue hover:bg-alorica-light'
                                    }`}
                                >
                                    <Icon name="calendar-check" size={18} /> Bookings
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setAdminView('users')}
                                    className={`flex items-center gap-2 px-6 sm:px-10 py-3 rounded-xl font-bold text-sm sm:text-base transition-all ${
                                        adminView === 'users'
                                            ? 'bg-alorica-orange text-white shadow-lg scale-105'
                                            : 'bg-gray-100 text-alorica-blue hover:bg-alorica-light'
                                    }`}
                                >
                                    <Icon name="users" size={18} /> Users
                                </button>
                            </div>

                            <div className="p-4 sm:p-8">
                                {adminView === 'bookings' ? (
                                <>
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-8 max-w-3xl mx-auto">
                                    <div className="bg-alorica-light rounded-2xl p-4 text-center">
                                        <p className="text-3xl font-black text-alorica-blue">{bookings.length}</p>
                                        <p className="text-xs text-gray-500 mt-1">Total Bookings</p>
                                    </div>
                                    <div className="bg-alorica-light rounded-2xl p-4 text-center">
                                        <p className="text-3xl font-black text-alorica-blue">{dayGroups.length}</p>
                                        <p className="text-xs text-gray-500 mt-1">Days</p>
                                    </div>
                                    <div className="bg-alorica-light rounded-2xl p-4 text-center col-span-2 sm:col-span-1">
                                        <p className="text-3xl font-black text-alorica-blue">{uniqueEmployees}</p>
                                        <p className="text-xs text-gray-500 mt-1">Employees</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-8 max-w-3xl mx-auto">
                                    <button
                                        type="button"
                                        onClick={handleSaveExcel}
                                        className="bg-alorica-blue hover:bg-opacity-90 text-white font-bold py-4 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all"
                                    >
                                        <Icon name="save" size={20} /> Save Excel
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleShare}
                                        disabled={sharing}
                                        className={`bg-alorica-orange hover:shadow-2xl text-white font-bold py-4 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all ${sharing ? 'opacity-70 cursor-wait' : ''}`}
                                    >
                                        <Icon name="share-2" size={20} /> {sharing ? 'Sharing...' : 'Share'}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handlePrint}
                                        className="bg-white border-2 border-alorica-blue text-alorica-blue font-bold py-4 px-4 rounded-xl shadow hover:bg-alorica-light flex items-center justify-center gap-2 transition-all"
                                    >
                                        <Icon name="printer" size={20} /> Print
                                    </button>
                                </div>
                                <p className="text-center text-xs text-gray-400 mb-8 -mt-4">
                                    The Excel file contains one sheet per day, with employee name, ID, booking time and pickup point.
                                </p>

                                {bookings.length === 0 ? (
                                    <p className="text-center text-gray-400 py-12">No bookings yet. Employee bookings will appear here.</p>
                                ) : (
                                    <div className="space-y-8">
                                        {dayGroups.map(({ day, items }) => (
                                            <div key={day} className="border border-gray-100 rounded-2xl overflow-hidden">
                                                <div className="bg-alorica-blue text-white px-4 py-3 flex justify-between items-center">
                                                    <span className="font-bold">{day}</span>
                                                    <span className="text-xs opacity-80">{items.length} booking{items.length === 1 ? '' : 's'}</span>
                                                </div>
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-sm">
                                                        <thead className="bg-alorica-light text-alorica-blue">
                                                            <tr>
                                                                <th className="text-left px-4 py-2 font-semibold">Employee Name</th>
                                                                <th className="text-left px-4 py-2 font-semibold">Employee ID</th>
                                                                <th className="text-left px-4 py-2 font-semibold">Booking Time</th>
                                                                <th className="text-left px-4 py-2 font-semibold">Pickup Point</th>
                                                                <th className="text-left px-4 py-2 font-semibold">Type</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {items.map((b) => (
                                                                <tr key={b.id} className="border-t border-gray-100">
                                                                    <td className="px-4 py-2 text-gray-800">{b.employeeName}</td>
                                                                    <td className="px-4 py-2 text-gray-600">{b.employeeId}</td>
                                                                    <td className="px-4 py-2 text-gray-600">{b.time}</td>
                                                                    <td className="px-4 py-2 text-gray-600">{b.location}</td>
                                                                    <td className="px-4 py-2">
                                                                        <span className={`text-xs font-semibold px-2 py-1 rounded-full ${b.type === 'Arrival' ? 'bg-green-50 text-green-700' : 'bg-orange-50 text-alorica-orange'}`}>
                                                                            {b.type}
                                                                        </span>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                </>
                                ) : (
                                <div className="max-w-3xl mx-auto">
                                    <div className="bg-alorica-light rounded-2xl p-6 mb-8">
                                        <h3 className="flex items-center gap-2 text-alorica-blue font-bold text-lg mb-4">
                                            <Icon name="user-plus" size={20} className="text-alorica-orange" /> Create New User
                                        </h3>
                                        <form onSubmit={handleCreateUser} className="space-y-4">
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Full Name</label>
                                                    <input
                                                        required
                                                        placeholder="e.g. Sara Mahmoud"
                                                        className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white text-sm"
                                                        value={newUser.name}
                                                        onChange={(e) => { setUserFeedback({ type: '', text: '' }); setNewUser({ ...newUser, name: e.target.value }); }}
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Username</label>
                                                    <input
                                                        required
                                                        placeholder="e.g. sara"
                                                        className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white text-sm"
                                                        value={newUser.username}
                                                        onChange={(e) => { setUserFeedback({ type: '', text: '' }); setNewUser({ ...newUser, username: e.target.value }); }}
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Password</label>
                                                    <input
                                                        required
                                                        placeholder="e.g. sara123"
                                                        className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white text-sm"
                                                        value={newUser.password}
                                                        onChange={(e) => { setUserFeedback({ type: '', text: '' }); setNewUser({ ...newUser, password: e.target.value }); }}
                                                    />
                                                </div>
                                            </div>

                                            {userFeedback.text && (
                                                <p className={`text-sm font-medium rounded-xl px-4 py-3 border fade-in ${
                                                    userFeedback.type === 'error'
                                                        ? 'bg-red-50 text-red-600 border-red-100'
                                                        : 'bg-green-50 text-green-700 border-green-100'
                                                }`}>
                                                    {userFeedback.text}
                                                </p>
                                            )}

                                            <button
                                                type="submit"
                                                className="w-full bg-alorica-blue hover:bg-opacity-90 text-white font-bold py-4 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all"
                                            >
                                                <Icon name="user-plus" size={20} /> Create User
                                            </button>
                                        </form>
                                    </div>

                                    <h3 className="text-alorica-blue font-bold text-lg mb-3">Existing Users ({allUsers.length})</h3>
                                    <div className="border border-gray-100 rounded-2xl overflow-hidden">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm">
                                                <thead className="bg-alorica-light text-alorica-blue">
                                                    <tr>
                                                        <th className="text-left px-4 py-2 font-semibold">Full Name</th>
                                                        <th className="text-left px-4 py-2 font-semibold">Username</th>
                                                        <th className="text-left px-4 py-2 font-semibold">Role</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {allUsers.map((u) => (
                                                        <tr key={u.username} className="border-t border-gray-100">
                                                            <td className="px-4 py-2 text-gray-800">{u.name}</td>
                                                            <td className="px-4 py-2 text-gray-600">{u.username}</td>
                                                            <td className="px-4 py-2">
                                                                <span className={`text-xs font-semibold px-2 py-1 rounded-full ${u.username === 'admin' ? 'bg-alorica-light text-alorica-blue' : 'bg-gray-100 text-gray-600'}`}>
                                                                    {u.username === 'admin' ? 'Admin' : 'User'}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    <p className="text-xs text-gray-400 mt-4 text-center">
                                        New users are created with a regular (non-admin) role and are saved in this browser.
                                    </p>
                                </div>
                                )}
                            </div>
                        </div>
                        ) : (
                        <div className="bg-white rounded-3xl shadow-2xl overflow-hidden border border-white">
                            <div className="bg-alorica-blue p-8 text-white text-center">
                                <h2 className="text-3xl font-bold mb-2">Transportation</h2>
                                <p className="opacity-80">Select Arrival or Departure to complete your booking</p>
                            </div>

                            {/* Arrival / Departure Tabs */}
                            <div className="flex justify-center gap-3 sm:gap-4 pt-6 px-4">
                                <button
                                    type="button"
                                    onClick={() => setActiveTab('arrival')}
                                    className={`flex items-center gap-2 px-8 sm:px-12 py-3 rounded-xl font-bold text-sm sm:text-base transition-all ${
                                        activeTab === 'arrival'
                                            ? 'bg-alorica-orange text-white shadow-lg scale-105'
                                            : 'bg-gray-100 text-alorica-blue hover:bg-alorica-light'
                                    }`}
                                >
                                    <Icon name="plane-landing" size={18} /> Arrival
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setActiveTab('departure')}
                                    className={`flex items-center gap-2 px-8 sm:px-12 py-3 rounded-xl font-bold text-sm sm:text-base transition-all ${
                                        activeTab === 'departure'
                                            ? 'bg-alorica-orange text-white shadow-lg scale-105'
                                            : 'bg-gray-100 text-alorica-blue hover:bg-alorica-light'
                                    }`}
                                >
                                    <Icon name="plane-takeoff" size={18} /> Departure
                                </button>
                            </div>

                            <form key={activeTab} onSubmit={handleBooking} className="p-4 sm:p-8 fade-in">
                                <div className="max-w-2xl mx-auto space-y-6">
                                    {savedMsg && (
                                        <div className="flex items-start gap-2 bg-green-50 text-green-700 border border-green-100 rounded-xl px-4 py-3 text-sm font-medium fade-in">
                                            <Icon name="check" size={18} className="mt-0.5 shrink-0" />
                                            <span>{savedMsg}</span>
                                        </div>
                                    )}

                                    {/* Employee details */}
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label className="flex items-center gap-2 text-alorica-blue font-bold mb-2">
                                                <Icon name="user" size={18} className="text-alorica-orange" /> Employee Name
                                            </label>
                                            <input
                                                required
                                                placeholder="Enter employee full name"
                                                className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50 text-sm sm:text-base"
                                                value={formData.employeeName}
                                                onChange={(e) => setFormData({ ...formData, employeeName: e.target.value })}
                                            />
                                        </div>
                                        <div>
                                            <label className="flex items-center gap-2 text-alorica-blue font-bold mb-2">
                                                <Icon name="hash" size={18} className="text-alorica-orange" /> Employee ID
                                            </label>
                                            <input
                                                required
                                                placeholder="Enter employee ID"
                                                className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50 text-sm sm:text-base"
                                                value={formData.employeeId}
                                                onChange={(e) => setFormData({ ...formData, employeeId: e.target.value })}
                                            />
                                        </div>
                                    </div>

                                    {/* Pickup (Arrival) / Drop off (Departure) location Field */}
                                    <div>
                                        <label className="flex flex-wrap items-center justify-between text-alorica-blue font-bold mb-2 gap-2">
                                            <span className="flex items-center gap-2"><Icon name={dropOffIcon} size={18} className="text-alorica-orange" /> {dropOffLabel}</span>
                                            <button 
                                                type="button" 
                                                onClick={() => getCurrentLocation('dropOffLocation')}
                                                className="text-[10px] sm:text-xs bg-alorica-light text-alorica-blue px-2 py-1 rounded hover:bg-blue-100 transition-colors flex items-center gap-1 shrink-0"
                                            >
                                                <Icon name="locate" size={12} /> My Location
                                            </button>
                                        </label>
                                        <input
                                            list="fixed-locations"
                                            required
                                            placeholder={`Select or enter ${dropOffLabel.toLowerCase()}`}
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50 text-sm sm:text-base"
                                            value={formData.dropOffLocation}
                                            onChange={(e) => setFormData({...formData, dropOffLocation: e.target.value})}
                                        />
                                    </div>

                                    {/* Pickup / Drop-off time picker (clock) */}
                                    <div>
                                        <label className="flex items-center gap-2 text-alorica-blue font-bold mb-2">
                                            <Icon name="clock" size={18} className="text-alorica-orange" /> {timeLabel}
                                        </label>
                                        <div className="rounded-xl border-2 border-gray-100 bg-gray-50 p-4">
                                            <div className="flex items-center justify-center font-mono font-bold text-alorica-blue mb-1">
                                                <span className="text-4xl sm:text-5xl">{displayHh}</span>
                                                <span className="text-4xl sm:text-5xl text-alorica-orange animate-pulse mx-1">:</span>
                                                <span className="text-4xl sm:text-5xl">{displayMm}</span>
                                            </div>
                                            <p className="text-center text-xs text-gray-400 mb-4">
                                                {formData.time ? 'Selected time' : 'Current time — pick yours below'}
                                            </p>
                                            <div className="grid grid-cols-2 gap-3 mb-3">
                                                <div>
                                                    <span className="block text-xs font-semibold text-gray-500 mb-1 text-center">Hour</span>
                                                    <select
                                                        className="w-full px-3 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white text-center font-semibold"
                                                        value={selHour}
                                                        onChange={(e) => setFormData({ ...formData, time: `${e.target.value}:${selMinute}` })}
                                                    >
                                                        {HOURS.map((h) => <option key={h} value={h}>{h}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <span className="block text-xs font-semibold text-gray-500 mb-1 text-center">Minute</span>
                                                    <select
                                                        className="w-full px-3 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white text-center font-semibold"
                                                        value={selMinute}
                                                        onChange={(e) => setFormData({ ...formData, time: `${selHour}:${e.target.value}` })}
                                                    >
                                                        {MINUTES.map((m) => <option key={m} value={m}>{m}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button
                                                    type="button"
                                                    onClick={() => setFormData({ ...formData, time: `${clock.hh}:${clock.mm}` })}
                                                    className="text-xs bg-alorica-light text-alorica-blue px-3 py-3 rounded-xl font-semibold hover:bg-blue-100 transition-colors whitespace-nowrap flex items-center gap-1 shrink-0"
                                                >
                                                    <Icon name="clock" size={14} /> Now
                                                </button>
                                                <select
                                                    required
                                                    className="flex-1 min-w-0 px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-white"
                                                    value={formData.timeZone}
                                                    onChange={(e) => setFormData({...formData, timeZone: e.target.value})}
                                                >
                                                    <option value="">Select timezone</option>
                                                    <option value="GMT+2">Cairo (GMT+2)</option>
                                                    <option value="GMT">London (GMT)</option>
                                                    <option value="GMT-5">New York (GMT-5)</option>
                                                    <option value="GMT+4">Dubai (GMT+4)</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="flex items-center gap-2 text-alorica-blue font-bold mb-2">
                                            <Icon name="calendar" size={18} className="text-alorica-orange" /> Calendar
                                        </label>
                                        <input 
                                            type="date" 
                                            required
                                            className="w-full px-4 py-3 border-2 border-gray-100 rounded-xl outline-none bg-gray-50"
                                            value={formData.date}
                                            onChange={(e) => setFormData({...formData, date: e.target.value})}
                                        />
                                    </div>

                                    <datalist id="fixed-locations">
                                        {FIXED_LOCATIONS.map((loc, index) => (
                                            <option key={index} value={loc} />
                                        ))}
                                    </datalist>

                                    <div className="pt-2">
                                        <button
                                            type="submit"
                                            disabled={locating}
                                            className={`w-full bg-alorica-orange hover:shadow-2xl text-white font-black text-xl py-5 rounded-2xl shadow-xl transform active:scale-[0.98] transition-all flex items-center justify-center gap-3 group ${locating ? 'opacity-70 cursor-wait' : ''}`}
                                        >
                                            {locating ? 'Detecting Location...' : 'Book now'}
                                            <Icon name="chevron-right" size={24} className="group-hover:translate-x-2 transition-transform" />
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                        )}
                    </main>

                    <footer className="mt-12 pb-8 text-center text-gray-500 text-sm">
                        <p>© 2026 Alorica Inc. All Rights Reserved.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
